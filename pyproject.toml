[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "college-builder"
version = "0.1.0"
description = "University STEM Dataset Builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "duckdb>=1,<2",
  "pyarrow>=17,<20",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<6",
  "markdownify>=0.13,<1",
  "sympy>=1.13,<2",
  "datasketch>=1.6,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
college-builder = "college_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["college_builder"]
mypy_path = "src"
