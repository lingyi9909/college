name: Task 3 Ruff Diagnostic

on:
  push:
    branches:
      - verification/task3-green

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 3 candidate
        uses: actions/checkout@v4
        with:
          ref: 493c2d6b66716fec095d2ab7a349bcd68c63bcf4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Show Ruff import diff
        run: ruff check src/college_builder/storage/parquet.py tests/unit/storage/test_state.py --select I --diff
