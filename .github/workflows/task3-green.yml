name: Task 3 Exact Candidate Gate

on:
  push:
    branches:
      - verification/task3-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 3 candidate
        uses: actions/checkout@v4
        with:
          ref: 493c2d6b66716fec095d2ab7a349bcd68c63bcf4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: pytest tests/unit/storage -q
        run: pytest tests/unit/storage -q
      - name: ruff check src tests
        run: ruff check src tests
      - name: mypy src
        run: mypy src
