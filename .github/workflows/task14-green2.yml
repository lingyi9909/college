name: Task 14 GREEN2
on:
  push:
    branches: [verification/task14-green2]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 14 candidate
        uses: actions/checkout@v4
        with:
          ref: 8a8f78deb12c1bda9cb858778aa0d7753d494105
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: git rev-parse HEAD
      - run: pytest tests/e2e/test_pipeline_resume.py tests/e2e/test_pipeline_report.py -q
      - run: ruff check src tests
      - run: mypy src
