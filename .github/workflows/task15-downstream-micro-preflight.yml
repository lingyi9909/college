name: Task 15 Downstream Micro Preflight

on:
  push:
    branches: [ci/task15-downstream-micro-cert]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: 01ab7f86b62d614239a3d5ceae6b83821cc9f664
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact feature and frozen config identity
        working-directory: work
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "01ab7f86b62d614239a3d5ceae6b83821cc9f664"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('config/pilot-5k-frozen.yaml').read_bytes()).hexdigest() == '24749a95a1faf84f909911f4f4fc0c59ee5b514c63b4f440efa64b2ea165fcf3'
          print('TASK15_DOWNSTREAM_MICRO_IDENTITY=PASS')
          PY
      - name: Syntax check
        run: python -m py_compile ci-source/ci/task15_downstream_micro.py
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Ruff script
        run: ruff check ci-source/ci/task15_downstream_micro.py
