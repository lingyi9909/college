name: Task 11 GREEN Candidate

on:
  push:
    branches:
      - verification/task11-green

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 11 candidate SHA
        uses: actions/checkout@v4
        with:
          ref: c861970a6093b92db5fc59a2958b493f6da9a523
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 11 targeted tests
        run: pytest tests/unit/quality/test_dedup.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
