name: Task16A2 Source Evidence RED

on:
  push:
    branches:
      - feature/task16-recall-hardening
    paths:
      - tests/unit/quality/test_task16_task15_answer_evidence.py
      - .github/workflows/task16a2-source-evidence-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Frozen Task15 evidence identity must be GREEN
        run: |
          pytest \
            tests/unit/quality/test_task16_task15_answer_evidence.py::test_task15_gate3_false_reject_inventory_is_frozen_to_real_source_identity \
            tests/unit/quality/test_task16_task15_answer_evidence.py::test_task15_source_evidence_fingerprint_is_stable \
            -q
      - name: Real Task15 extraction cases must be RED before implementation
        shell: bash
        run: |
          set +e
          pytest tests/unit/quality/test_task16_task15_answer_evidence.py::test_task15_real_gate3_false_rejects_extract_exact_source_evidence -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected real Task15 Gate3 extraction regressions to fail before implementation.'
            exit 1
          fi
          echo 'TASK16_A2_REAL_SOURCE_EVIDENCE_RED=PASS'
