name: Task16C Small-20 False-Accept Regression

on:
  push:
    branches: [hotfix/task16c-small20-fa-fix]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run Small-20 false-accept regressions
        run: pytest -q tests/unit/quality/test_task16c_small20_false_accepts.py
