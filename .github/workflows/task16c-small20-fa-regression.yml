name: Task16C Small-20 False-Accept Regression

on:
  push:
    branches: [hotfix/task16c-small20-fa-fix]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Small-20 false-accept regressions
        run: pytest -q tests/unit/quality/test_task16c_small20_false_accepts.py tests/unit/quality/test_task16c_small200_authority_hint.py tests/e2e/test_task15_provider_prompt_protocol.py
      - name: Fresh full pytest
        run: pytest -q
      - name: Fresh Ruff
        run: ruff check src tests
      - name: Fresh MyPy
        run: mypy src
