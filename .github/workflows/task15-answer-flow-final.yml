name: Task 15 Source-Grounded Answer Flow Exact-Head Verify

on:
  push:
    branches: [ci/task15-answer-flow-final]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task15-pilot-freeze
          fetch-depth: 0
      - name: Assert exact feature HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6ee9a8a63e72cf9bbb84d60341c37404e6e39570"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Targeted Gate4 propagation
        run: pytest -q tests/e2e/test_pipeline_resume.py -k stackmathqa_solution_only_flow_supplies_extracted_answer_through_export
      - name: Targeted Gate5 evidence
        run: pytest -q tests/unit/quality/test_verify.py -k prompt_answer_reference_when_answer_is_extracted_from_analysis
      - name: Relevant regressions
        run: >-
          pytest -q
          tests/e2e/test_pipeline_resume.py
          tests/e2e/test_final_export.py
          tests/e2e/test_gold_regression.py
          tests/e2e/test_task15_pipeline_concurrency.py
          tests/unit/quality/test_verify.py
          tests/unit/quality/test_answer.py
      - name: Fresh full pytest
        run: pytest -q
      - name: Fresh Ruff
        run: ruff check src tests
      - name: Fresh MyPy
        run: mypy src
      - name: Exact-head scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          test -z "$(git ls-files 'artifacts/5k/sample.jsonl')"
          ! git ls-files | grep -Eq '^\.github/workflows/task15-'
          python - <<'PY'
          import subprocess
          expected = {
              'src/college_builder/pipeline/runner.py',
              'src/college_builder/quality/verify.py',
              'tests/e2e/test_pipeline_resume.py',
              'tests/unit/quality/test_verify.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          PY
          test "$(git rev-parse HEAD^)" = "3d1c047563d34d3de9bed01200256a50d84fb435"
          test "$(git rev-parse HEAD)" = "6ee9a8a63e72cf9bbb84d60341c37404e6e39570"
          test -z "$(git status --porcelain)"
          echo TASK15_EXACT_HEAD_VERIFIED=$(git rev-parse HEAD)
