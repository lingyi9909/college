name: Task 15 Source-Grounded Answer Flow Scope Verify

on:
  push:
    branches: [ci/task15-answer-flow-final]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task15-pilot-freeze
          fetch-depth: 0
      - name: Exact-head scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          python - <<'PY'
          import subprocess

          expected_head = '6ee9a8a63e72cf9bbb84d60341c37404e6e39570'
          expected_parent = '3d1c047563d34d3de9bed01200256a50d84fb435'
          expected_files = {
              'src/college_builder/pipeline/runner.py',
              'src/college_builder/quality/verify.py',
              'tests/e2e/test_pipeline_resume.py',
              'tests/unit/quality/test_verify.py',
          }

          def out(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          head = out('git', 'rev-parse', 'HEAD')
          parent = out('git', 'rev-parse', 'HEAD^')
          changed = set(out('git', 'diff', '--name-only', 'HEAD^', 'HEAD').splitlines())
          tracked = set(out('git', 'ls-files').splitlines())
          status = out('git', 'status', '--porcelain')

          task15_workflows = sorted(
              p for p in tracked if p.startswith('.github/workflows/task15-')
          )
          raw_5k = sorted(
              p for p in tracked
              if p == 'artifacts/5k/sample.jsonl'
              or p.startswith('workspace/')
              or p.startswith('output/raw')
          )

          print('HEAD=', head)
          print('PARENT=', parent)
          print('CHANGED=', sorted(changed))
          print('TASK15_WORKFLOWS=', task15_workflows)
          print('RAW_5K_TRACKED=', raw_5k)
          print('STATUS=', repr(status))

          assert head == expected_head, (head, expected_head)
          assert parent == expected_parent, (parent, expected_parent)
          assert changed == expected_files, (changed, expected_files)
          assert not task15_workflows, task15_workflows
          assert not raw_5k, raw_5k
          assert status == '', status
          print('TASK15_SCOPE_GUARD=PASS')
          PY
