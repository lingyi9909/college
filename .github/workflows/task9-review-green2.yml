name: Task 9 Review GREEN 2

on:
  push:
    branches:
      - verification/task9-review-green2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 9 review GREEN 2
        uses: actions/checkout@v4
        with:
          ref: 99b66a03be11059a6646b472d2e98fd0b82ff4f7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 9 tests
        run: pytest tests/unit/providers tests/unit/quality/test_classify.py -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
