name: Task 15 Real-100 Structure Preflight

on:
  push:
    branches: [ci/task15-real100-rebaseline]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile ci/task15_real100_prepare.py ci/task15_real100_report.py
      - name: Ruff scripts
        run: |
          python -m pip install ruff
          ruff check ci/task15_real100_prepare.py ci/task15_real100_report.py
