name: Task 14 Exact Head
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e43489be59893fe5901395b3b03661ea15ad6e1d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: git rev-parse HEAD
      - run: pytest tests/e2e/test_pipeline_report.py tests/e2e/test_pipeline_resume.py -q
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy src
