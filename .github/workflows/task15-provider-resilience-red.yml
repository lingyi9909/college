name: Task 15 Provider Resilience RED

on:
  push:
    branches:
      - ci/task15-provider-resilience-tdd

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/providers/test_openai_compatible_resilience.py tests/unit/test_provider_config_resilience.py
