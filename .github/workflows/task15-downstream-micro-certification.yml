name: Task 15 Downstream Micro Model Certification

on:
  push:
    branches: [ci/task15-downstream-micro-cert]

permissions:
  contents: read
  actions: read

jobs:
  downstream-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.TASK15_OPENAI_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.TASK15_OPENAI_API_KEY }}
      TASK15_PRIOR_ARTIFACT: ../prior-artifact/100-sample.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: 01ab7f86b62d614239a3d5ceae6b83821cc9f664
          path: work
      - name: Assert exact feature identity
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "01ab7f86b62d614239a3d5ceae6b83821cc9f664"
          test -n "$OPENAI_COMPATIBLE_BASE_URL"
          test -n "$OPENAI_COMPATIBLE_API_KEY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-head package
        working-directory: work
        run: python -m pip install -e '.[dev]'
      - name: Download immutable real-100 source artifact
        uses: actions/download-artifact@v4
        with:
          name: task15-real100-certification
          path: prior-artifact
          github-token: ${{ github.token }}
          repository: lingyi9909/college
          run-id: 34558426996
      - name: Execute real-model downstream micro certification
        working-directory: work
        run: python ../ci-source/ci/task15_downstream_micro.py
      - name: Certification sanity guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/task15-downstream-cert/downstream_real_model_certification.json')
          report = json.loads(p.read_text(encoding='utf-8'))
          assert report['status'] == 'PASS'
          assert report['feature_exact_head'] == '01ab7f86b62d614239a3d5ceae6b83821cc9f664'
          assert report['production_code_sha'] == 'd3b35964ac92d799405fd88101fa11fd05ff1460'
          assert report['source_real100_run_id'] == 34558426996
          assert report['record_count'] == 3
          assert report['gate5_alignment_pass_count'] == 3
          assert report['independent_correctness_pass_count'] == 3
          assert report['final_dedup_kept_count'] == 3
          assert report['final_dedup_dropped_count'] == 0
          assert report['exact_19_field_export_count'] == 3
          assert report['verifier'] == {'provider': 'openai_compatible', 'model': 'deepseek-v4-pro'}
          assert report['provider_call_counts'].get('gate_5_qa_alignment') == 3
          assert report['provider_call_counts'].get('independent_correctness_verification') == 3
          if not report['tokens_available']:
              assert report['tokens'] is None
          q = Path('/tmp/task15-downstream-cert/export/questions.jsonl')
          assert len(q.read_text(encoding='utf-8').splitlines()) == 3
          print('TASK15_DOWNSTREAM_MICRO_CERTIFICATION=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task15-downstream-real-model-certification
          path: /tmp/task15-downstream-cert/
          if-no-files-found: error
          retention-days: 30
