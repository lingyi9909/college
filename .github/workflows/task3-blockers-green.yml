name: Task 3 Blocker Fix Gate

on:
  push:
    branches:
      - verification/task3-blockers-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: bb10976afc22dc2705438de7ecb7bb3f57eea706
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: pytest tests/unit/storage -q
        run: pytest tests/unit/storage -q
      - name: ruff check src tests
        run: ruff check src tests
      - name: mypy src
        run: mypy src
