name: Task16B Small Real-Model Re-certification

on:
  push:
    branches: [ci/task16b-small-recert]

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.TASK15_OPENAI_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.TASK15_OPENAI_API_KEY }}
      TASK16B_CODE_SHA: 456174b0ed0497239733ddd2909eea39eda83ecb
      TASK16B_SAMPLE_SHA: 50026b04d0d5a55a27c8a796f54f35eeea756410835a82c29bbd155013d08304
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: 456174b0ed0497239733ddd2909eea39eda83ecb
          path: work
      - name: Guard exact production identity and model secrets
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK16B_CODE_SHA"
          test -n "$OPENAI_COMPATIBLE_BASE_URL"
          test -n "$OPENAI_COMPATIBLE_API_KEY"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml
          manifest = json.loads(Path('artifacts/task16/re-certification/sample_manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 'task16-small-recert-sample-v2'
          assert manifest['selection_frozen_before_model_calls'] is True
          assert manifest['sample']['total'] == 50
          assert manifest['sample']['sample_payload_sha256'] == '50026b04d0d5a55a27c8a796f54f35eeea756410835a82c29bbd155013d08304'
          assert len(manifest['records']) == 50
          config = yaml.safe_load(Path('config/task16-recertification.yaml').read_text(encoding='utf-8'))
          assert config['config_version'] == 'task16-recertification-v2'
          assert config['prompt_versions'] == {
              'university_classify': 'v1',
              'problem_classify': 'v1',
              'analysis_classify': 'v3',
              'qa_alignment': 'v2',
              'correctness_verify': 'v2',
          }
          print('TASK16B_IDENTITY_GUARD=PASS')
          print('TASK16B_CONFIG_SHA256=' + hashlib.sha256(Path('config/task16-recertification.yaml').read_bytes()).hexdigest())
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: work
        run: python -m pip install -e '.[dev]'
      - name: Pre-model Task16 focused regressions
        working-directory: work
        run: >-
          pytest -q
          tests/unit/quality/test_task16_gate2_conflict.py
          tests/unit/quality/test_task16_answer_recall.py
          tests/unit/quality/test_task16_task15_answer_evidence.py
          tests/unit/quality/test_task16a3_analysis_evidence_relevance.py
          tests/unit/quality/test_task16a4_downstream_span_protocol.py
          tests/e2e/test_task15_provider_prompt_protocol.py
          tests/e2e/test_gold_regression.py
      - name: Download immutable Task15 real-100 parent artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream
          gh run download 34558426996 --repo lingyi9909/college --name task15-real100-certification --dir /tmp/upstream
          test -f /tmp/upstream/100-sample.jsonl
          test -f /tmp/upstream/100-manifest.json
      - name: Reconstruct and guard frozen Task16B sample
        working-directory: work
        run: python ../ci-source/ci/task16b_prepare.py
      - name: Execute exact production pipeline on frozen 50
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          college-builder run \
            --input /tmp/task16b-sample.jsonl \
            --config config/task16-recertification.yaml \
            --workspace /tmp/task16b-workspace \
            --output /tmp/task16b-output
      - name: Build bounded certification evidence
        working-directory: work
        run: python ../ci-source/ci/task16b_report.py
      - name: Certification structural guards
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/task16b-certification/run_report.json').read_text(encoding='utf-8'))
          assert r['exact_code_sha'] == '456174b0ed0497239733ddd2909eea39eda83ecb'
          assert r['sample_payload_sha256'] == '50026b04d0d5a55a27c8a796f54f35eeea756410835a82c29bbd155013d08304'
          assert r['sample_count'] == 50
          assert r['config_version'] == 'task16-recertification-v2'
          assert r['classifier']['name'] == 'openai_compatible'
          assert r['classifier']['model'] == 'deepseek-flash'
          assert r['verifier']['name'] == 'openai_compatible'
          assert r['verifier']['model'] == 'deepseek-v4-pro'
          assert r['provider_errors'] == 0
          assert r['accepted_count'] + r['rejected_count'] == 50
          assert r['exact_19_field_export_valid'] is True
          if not r['tokens_available']:
              assert r['tokens'] is None
          if not r['estimated_cost_usd_available']:
              assert r['estimated_cost_usd'] is None
          print('TASK16B_STRUCTURAL_GUARDS=PASS')
          print(json.dumps(r['before_after'], sort_keys=True))
          print(json.dumps(r['reject_reason_counts'], sort_keys=True))
          PY
      - name: Fresh full pytest
        working-directory: work
        run: pytest -q
      - name: Fresh Ruff
        working-directory: work
        run: ruff check src tests
      - name: Fresh MyPy
        working-directory: work
        run: mypy src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task16b-small-recertification
          path: |
            /tmp/task16b-certification/
            /tmp/task16b-workspace/
            /tmp/task16b-output/
          if-no-files-found: warn
          retention-days: 30
