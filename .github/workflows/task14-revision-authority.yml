name: Task 14 Revision Authority Repair
on:
  push:
    branches:
      - ci/task14-revision-authority
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task14-revision-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Add revision authority regression tests first
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/test_pipeline_resume.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_mutable_symbolic_source_revision_does_not_authorize_snapshot_cache'
          if marker not in text:
              text += '''\n\n@pytest.mark.parametrize("revision", ["main", "master", "latest", "dev", "release-v1"])\ndef test_mutable_symbolic_source_revision_does_not_authorize_snapshot_cache(\n    tmp_path: Path, revision: str\n) -> None:\n    config = _config()\n    workspace = tmp_path / revision\n    first_adapter = CountingAdapter(\n        (_record(1, "VALID", question_override="Q1: Calculate 1 + 1"),),\n        revision=revision,\n    )\n    first = _runner(config=config, workspace=workspace).run(\n        adapter=first_adapter,\n        source_config={},\n        output_dir=tmp_path / f"{revision}-first",\n    )\n\n    second_adapter = CountingAdapter(\n        (_record(1, "VALID", question_override="Q2: Calculate 2 + 2"),),\n        revision=revision,\n    )\n    second = _runner(config=config, workspace=workspace).run(\n        adapter=second_adapter,\n        source_config={},\n        output_dir=tmp_path / f"{revision}-second",\n    )\n    output = json.loads(second.output_path.read_text(encoding="utf-8").splitlines()[0])\n\n    assert first_adapter.acquire_calls == 1\n    assert second_adapter.acquire_calls == 1\n    assert first.run_id != second.run_id\n    assert "Q2" in output["text_question"]\n    assert "Q1" not in output["text_question"]\n\n\ndef test_explicit_immutable_revision_can_reuse_acquisition_snapshot(tmp_path: Path) -> None:\n    config = _config()\n    workspace = tmp_path / "immutable-same"\n    revision = "sha256:" + "a" * 64\n    records = (_record(1, "VALID"),)\n    first_adapter = CountingAdapter(records, revision=revision)\n    first = _runner(config=config, workspace=workspace).run(\n        adapter=first_adapter,\n        source_config={},\n        output_dir=tmp_path / "immutable-first",\n    )\n\n    second_adapter = CountingAdapter(records, revision=revision)\n    second = _runner(config=config, workspace=workspace).run(\n        adapter=second_adapter,\n        source_config={},\n        output_dir=tmp_path / "immutable-second",\n    )\n\n    assert first.run_id == second.run_id\n    assert first_adapter.acquire_calls == 1\n    assert second_adapter.acquire_calls == 0\n\n\ndef test_explicit_immutable_revision_change_creates_new_snapshot_and_run(tmp_path: Path) -> None:\n    config = _config()\n    workspace = tmp_path / "immutable-change"\n    first_adapter = CountingAdapter(\n        (_record(1, "VALID", question_override="Q1: Calculate 1 + 1"),),\n        revision="sha256:" + "a" * 64,\n    )\n    first = _runner(config=config, workspace=workspace).run(\n        adapter=first_adapter,\n        source_config={},\n        output_dir=tmp_path / "immutable-change-first",\n    )\n\n    second_adapter = CountingAdapter(\n        (_record(1, "VALID", question_override="Q2: Calculate 2 + 2"),),\n        revision="sha256:" + "b" * 64,\n    )\n    second = _runner(config=config, workspace=workspace).run(\n        adapter=second_adapter,\n        source_config={},\n        output_dir=tmp_path / "immutable-change-second",\n    )\n    output = json.loads(second.output_path.read_text(encoding="utf-8").splitlines()[0])\n\n    assert first_adapter.acquire_calls == 1\n    assert second_adapter.acquire_calls == 1\n    assert first.run_id != second.run_id\n    assert "Q2" in output["text_question"]\n'''
              path.write_text(text, encoding='utf-8')
          PY
          ruff format tests/e2e/test_pipeline_resume.py
          git diff --check
          git config user.name lingyi9909
          git config user.email zhanhui9909@gmail.com
          git add tests/e2e/test_pipeline_resume.py
          git commit -m 'test: cover immutable source revision authority'
          git push origin HEAD:fix/task14-revision-authority
      - name: Prove mutable symbolic revisions are RED
        shell: bash
        run: |
          set +e
          pytest tests/e2e/test_pipeline_resume.py -q -k mutable_symbolic_source_revision 2>&1 | tee /tmp/task14-revision-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected mutable symbolic revision regression to fail before production fix'
            exit 1
          fi
          grep -q 'assert 0 == 1' /tmp/task14-revision-red.log
          grep -q 'test_mutable_symbolic_source_revision_does_not_authorize_snapshot_cache' /tmp/task14-revision-red.log
      - name: Apply minimal immutable revision authority fix
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('src/college_builder/pipeline/runner.py')
          text = runner.read_text(encoding='utf-8')
          old_import = 'import hashlib\nimport json\nimport time\n'
          new_import = 'import hashlib\nimport json\nimport re\nimport time\n'
          if old_import not in text:
              raise SystemExit('runner import anchor missing')
          text = text.replace(old_import, new_import, 1)
          old = '''def _has_trusted_source_revision(descriptor: SourceDescriptor) -> bool:\n    revision = descriptor.source_revision\n    return isinstance(revision, str) and bool(revision.strip())\n'''
          new = '''def _has_trusted_source_revision(descriptor: SourceDescriptor) -> bool:\n    revision = descriptor.source_revision\n    if not isinstance(revision, str):\n        return False\n    return bool(\n        re.fullmatch(r"sha256:[0-9a-fA-F]{64}", revision)\n        or re.fullmatch(r"git:(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})", revision)\n    )\n'''
          if old not in text:
              raise SystemExit('trusted revision helper anchor missing')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/e2e/test_pipeline_resume.py')
          test_text = tests.read_text(encoding='utf-8')
          old_default = 'revision: str | None = "fixture-v1"'
          immutable_default = 'revision: str | None = "sha256:' + ('1' * 64) + '"'
          if old_default not in test_text:
              raise SystemExit('CountingAdapter default revision anchor missing')
          tests.write_text(test_text.replace(old_default, immutable_default, 1), encoding='utf-8')
          PY
          ruff format src/college_builder/pipeline/runner.py tests/e2e/test_pipeline_resume.py
          ruff check --fix src/college_builder/pipeline/runner.py tests/e2e/test_pipeline_resume.py
          git diff --check
      - name: Targeted Task 14 E2E
        run: pytest tests/e2e/test_pipeline_report.py tests/e2e/test_pipeline_resume.py -q
      - name: Full tests
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
      - name: Commit verified production repair
        run: |
          git config user.name lingyi9909
          git config user.email zhanhui9909@gmail.com
          git add src/college_builder/pipeline/runner.py tests/e2e/test_pipeline_resume.py
          git commit -m 'fix: require immutable source revision authority'
          git push origin HEAD:fix/task14-revision-authority
