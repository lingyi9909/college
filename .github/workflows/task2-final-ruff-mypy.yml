name: Task 2 Final Ruff MyPy Verification

on:
  push:
    branches:
      - verification/task2-final-ruff-mypy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 2 HEAD
        uses: actions/checkout@v4
        with:
          ref: 74e827ec7b5686e8955ed355c6e2e278e0581df5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: ruff check src tests
        run: ruff check src tests
      - name: mypy src
        run: mypy src
