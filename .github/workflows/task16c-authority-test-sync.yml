name: Task16C Authority Test Sync

on:
  push:
    branches: [hotfix/task16c-small200-authority-hint]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update intentional request contract assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/quality/test_verify.py')
          text = path.read_text(encoding='utf-8')
          old1 = '''    assert request.inputs == {\n        "question": candidate.question,\n        "answer": candidate.answer,\n        "analysis": candidate.analysis,\n    }\n'''
          new1 = '''    assert request.inputs == {\n        "question": candidate.question,\n        "answer": candidate.answer,\n        "analysis": candidate.analysis,\n        "answer_source_reference": f"answer:0-{len(candidate.answer)}",\n    }\n'''
          count = text.count(old1)
          if count != 2:
              if text.count(new1) == 2:
                  print('TEST_SYNC_ALREADY_APPLIED')
                  raise SystemExit(0)
              raise SystemExit(f'unexpected request assertion count: {count}')
          path.write_text(text.replace(old1, new1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/quality/test_verify.py
          git commit -m "test: sync Gate5 authority-reference request contract"
          git push origin HEAD:hotfix/task16c-small200-authority-hint
