name: Task 13 Exact HEAD Gate
on:
  push:
    branches:
      - verification/task13-exact-head

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 13 develop exact HEAD
        uses: actions/checkout@v4
        with:
          ref: 8e60eedc7374e748b899d772ed7b136662c63d0b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 13 targeted tests
        run: pytest tests/unit/export tests/e2e/test_final_export.py -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
