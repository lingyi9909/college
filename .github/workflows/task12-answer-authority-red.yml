name: Task 12 Answer Authority RED

on:
  push:
    branches:
      - verification/task12-answer-authority-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 12 answer-authority tests-only SHA
        uses: actions/checkout@v4
        with:
          ref: 76f717fa6937027720f5fa6013275f5283a7d351
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Run answer-authority regression
        run: pytest tests/golden/test_task12_answer_authority.py -q
