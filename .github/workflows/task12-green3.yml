name: Task 12 GREEN Candidate 3

on:
  push:
    branches:
      - verification/task12-green3

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 12 candidate SHA
        uses: actions/checkout@v4
        with:
          ref: 46094f0aa10a64e709121005479787cc3f7d16d7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 12 targeted tests
        run: pytest tests/unit/quality/test_verify.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
