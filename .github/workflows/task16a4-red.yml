name: Task16A4 RED

on:
  push:
    branches:
      - ci/task16a4-red
    paths:
      - .github/workflows/task16a4-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 484e27b1a59e79dab594df2eceaad4072889fd0c
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "484e27b1a59e79dab594df2eceaad4072889fd0c"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A4 focused RED
        run: pytest tests/unit/quality/test_task16a4_downstream_span_protocol.py tests/e2e/test_task15_provider_prompt_protocol.py -q
