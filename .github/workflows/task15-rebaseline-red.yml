name: Task 15 Rebaseline RED

on:
  push:
    branches: [ci/task15-rebaseline-red]

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Confirm both new contracts are RED
        shell: bash
        run: |
          set +e
          pytest -q tests/e2e/test_task15_calibration_holdout_red.py
          HOLDOUT_RC=$?
          pytest -q tests/unit/pipeline/test_task15_child_sample_red.py
          CHILD_RC=$?
          set -e
          echo HOLDOUT_RC=$HOLDOUT_RC
          echo CHILD_RC=$CHILD_RC
          test "$HOLDOUT_RC" -ne 0
          test "$CHILD_RC" -ne 0
          echo TASK15_REBASELINE_RED_CONFIRMED
