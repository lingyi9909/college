name: Task16A1 Blockers RED

on:
  push:
    branches:
      - verification/task16a1-blockers-red

permissions:
  contents: read

jobs:
  red-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2940a9fc27b4b2c9d1489f7e6c78622f1ec71755
      - name: Exact candidate guard
        run: test "$(git rev-parse HEAD)" = "2940a9fc27b4b2c9d1489f7e6c78622f1ec71755"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A1 focused RED regressions
        run: pytest tests/unit/quality/test_task16_gate2_conflict.py -q
