name: Task16A4 Answer Evidence FINAL

on:
  push:
    branches:
      - ci/task16a4-answer-evidence-final

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa81a36aa4e322952030b4d10e1ec0febbb98834
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "aa81a36aa4e322952030b4d10e1ec0febbb98834"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Task16A4 focused
        run: pytest tests/unit/quality/test_task16a4_downstream_span_protocol.py -q
      - name: test_verify.py
        run: pytest tests/unit/quality/test_verify.py -q
      - name: Gold regression
        run: pytest tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
