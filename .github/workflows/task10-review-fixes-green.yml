name: Task 10 Review Fixes GREEN

on:
  push:
    branches:
      - verification/task10-review-fixes-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 10 review fixes exact head
        uses: actions/checkout@v4
        with:
          ref: 25e1101fe2918af11c53c60cc759ae4492f2211f
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 10 targeted tests
        run: pytest tests/unit/quality/test_answer.py tests/unit/quality/test_analysis.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
