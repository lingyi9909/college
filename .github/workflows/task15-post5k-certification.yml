name: Task 15 Post-5K Certification

on:
  push:
    branches:
      - ci/task15-post5k-certification

permissions:
  contents: read

jobs:
  certify:
    if: github.event.head_commit.message == 'ci: trigger final Task 15 certification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task15-pilot-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'

      - name: Capture exact feature HEAD
        run: |
          echo "TASK15_FEATURE_HEAD=$(git rev-parse HEAD)"
          git status --short

      - name: Verify frozen config and formal evidence identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml

          config_path = Path('config/pilot-5k-frozen.yaml')
          config_sha = hashlib.sha256(config_path.read_bytes()).hexdigest()
          assert config_sha == '24749a95a1faf84f909911f4f4fc0c59ee5b514c63b4f440efa64b2ea165fcf3', config_sha
          config = yaml.safe_load(config_path.read_text(encoding='utf-8'))
          assert config['thresholds'] == {
              'university': 0.98,
              'problem': 0.98,
              'answer_extract': 0.995,
              'analysis': 0.98,
              'qa_alignment': 0.995,
          }
          assert config['providers']['classifier']['model'] == 'deepseek-flash'
          assert config['providers']['verifier']['model'] == 'deepseek-v4-pro'
          assert config['prompt_versions']['analysis_classify'] == 'v2'

          report = json.loads(Path('artifacts/5k/run_report.json').read_text(encoding='utf-8'))
          assert report['status'] == 'EXECUTED', report.get('status')
          assert report['sampling']['sample_sha256'] == 'e9d7b957a092114da35dbb839319a08ab555692a8a06863faf2b1980c2a681c5'
          assert report['sampling']['seed'] == 20260910
          assert report['sampling']['quotas'] == {
              'math': 2000,
              'mathoverflow': 1000,
              'physics': 1000,
              'statistics': 1000,
          }
          assert report['providers']['classifier'] == 'openai_compatible/deepseek-flash'
          assert report['providers']['verifier'] == 'openai_compatible/deepseek-v4-pro'
          assert report['prompt_versions']['analysis_classify'] == 'v2'
          assert report['config_sha256'] == config_sha
          assert report['raw_rows_committed'] is False
          reject_counts = report.get('metrics', {}).get('reject_reason_counts', report.get('reject_reason_counts', {}))
          assert 'VERIFIER_NOT_INDEPENDENT' not in reject_counts
          print('TASK15_FORMAL_EVIDENCE_IDENTITY=PASS')
          PY

      - name: Gold regression
        run: pytest -q tests/e2e/test_gold_regression.py

      - name: Task 15 focused regressions
        run: >-
          pytest -q
          tests/e2e/test_pilot_5k.py
          tests/e2e/test_pilot_sample_command.py
          tests/e2e/test_task15_pipeline_concurrency.py
          tests/e2e/test_task15_provider_prompt_protocol.py
          tests/unit/providers/test_openai_compatible_resilience.py
          tests/unit/test_provider_config_resilience.py

      - name: Full pytest
        run: pytest -q

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy src

      - name: No raw 5K or CI-only workflow leakage
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -Eq '^artifacts/5k/(sample\.jsonl|output/|workspace/)'
          ! git ls-files | grep -Eq '^\.github/workflows/task15-(formal-5k|deepseek|cancel|post5k|monitor)'
          ! grep -R --line-number -E 'BLOCKED_STABLE_PROVIDER_IDENTITY|pilot-classifier-v1|pilot-verifier-v1' artifacts/5k/run_report.json docs/validation/5k-dry-run-report.md
          git diff --exit-code
          echo TASK15_SCOPE_AND_RAW_GUARDS=PASS
