name: Task 15 Reviewer Exact HEAD

on:
  push:
    branches:
      - verification/task15-review-exact-head

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 15 candidate
        uses: actions/checkout@v4
        with:
          ref: 6ee9a8a63e72cf9bbb84d60341c37404e6e39570
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 15 targeted
        run: >-
          pytest
          tests/e2e/test_pilot_5k.py
          tests/e2e/test_pilot_sample_command.py
          tests/e2e/test_gold_regression.py
          tests/e2e/test_task15_pipeline_concurrency.py
          tests/e2e/test_task15_provider_prompt_protocol.py
          tests/unit/pipeline/test_pilot.py
          tests/unit/providers/test_openai_compatible_resilience.py
          tests/unit/test_provider_config_resilience.py
          -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 15 candidate
        uses: actions/checkout@v4
        with:
          ref: 6ee9a8a63e72cf9bbb84d60341c37404e6e39570
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Independent Task 15 acceptance contracts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import yaml

          from college_builder.pipeline.runner import GatePipelineProcessor, PipelineRunner
          from college_builder.source.gold import GoldDatasetAdapter

          failures = []
          candidate = "6ee9a8a63e72cf9bbb84d60341c37404e6e39570"

          # Contract 1: Task 15 cannot be accepted with a blocked/preflight summary.
          report_path = Path("artifacts/5k/run_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "EXECUTED":
              failures.append(f"formal 5K status is not EXECUTED: {report.get('status')!r}")
          for required in ("funnel", "reject_reason_counts"):
              if required not in report:
                  failures.append(f"formal 5K report lacks {required}")

          # Contract 2: committed 5K evidence must match the exact frozen config used now.
          config_path = Path("config/pilot-5k-frozen.yaml")
          config_bytes = config_path.read_bytes()
          config_sha = hashlib.sha256(config_bytes).hexdigest()
          config = yaml.safe_load(config_bytes)
          if report.get("config_sha256") != config_sha:
              failures.append(
                  f"5K report config hash is stale: report={report.get('config_sha256')} current={config_sha}"
              )
          if report.get("prompt_versions") != config.get("prompt_versions"):
              failures.append("5K report prompt versions do not match frozen config")
          providers = report.get("providers") or {}
          expected_classifier = f"{config['providers']['classifier']['name']}/{config['providers']['classifier']['model']}"
          expected_verifier = f"{config['providers']['verifier']['name']}/{config['providers']['verifier']['model']}"
          if providers.get("classifier") != expected_classifier or providers.get("verifier") != expected_verifier:
              failures.append(
                  f"5K report provider identities are stale: {providers!r}, expected classifier={expected_classifier!r}, verifier={expected_verifier!r}"
              )

          # Contract 3: Task 6's CALIBRATION_GOLD holdout must not become an SFT training export.
          spec = importlib.util.spec_from_file_location("gold_reg", "tests/e2e/test_gold_regression.py")
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)
          with TemporaryDirectory() as td:
              root = Path(td)
              data = root / "calibration.jsonl"
              data.write_text(
                  json.dumps({
                      "id": "holdout-1",
                      "question": "Solve 2*x + 3 = 11 for x.",
                      "answer": "x = 4",
                      "solution": "Subtract 3 to get 2*x = 8, then divide by 2. Therefore x = 4.",
                  }) + "\n",
                  encoding="utf-8",
              )
              source_config = {
                  "dataset_name": "stemq",
                  "data_file": str(data),
                  "source_url": "https://gold.invalid/stemq",
                  "revision": "git:" + "d" * 40,
                  "gold_role": "CALIBRATION_GOLD",
                  "language": "en",
                  "field_mapping": {
                      "source_id": "id",
                      "question": "question",
                      "answer": "answer",
                      "solution": "solution",
                  },
                  "license_metadata": {"declared": "CC-BY-4.0"},
              }
              config_obj = mod._config()
              workspace = root / "workspace"
              processor = GatePipelineProcessor(
                  config=config_obj,
                  cache_path=workspace / "cache" / "calls.sqlite3",
                  primary_provider=mod.GoldRegressionProvider("gold-primary"),
                  verifier_provider=mod.GoldRegressionProvider("gold-verifier"),
                  project_root=Path("."),
              )
              result = PipelineRunner(
                  config=config_obj,
                  workspace=workspace,
                  processor=processor,
              ).run(
                  adapter=GoldDatasetAdapter(),
                  source_config=source_config,
                  output_dir=root / "output",
              )
              exported = result.output_path.read_text(encoding="utf-8").strip()
              if result.accepted_count != 0 or exported:
                  failures.append("CALIBRATION_GOLD holdout was emitted as formal SFT training output")

          if failures:
              print("TASK15_ACCEPTANCE_RED")
              for failure in failures:
                  print("-", failure)
              raise SystemExit(1)
          print("TASK15_ACCEPTANCE_GREEN", candidate)
          PY
