name: Task 12 Develop Exact HEAD Gate

on:
  push:
    branches:
      - verification/task12-exact-head

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 12 develop exact HEAD
        uses: actions/checkout@v4
        with:
          ref: 74176b2f8daeed99ce1a0362e9264a2f5e8589d8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 12 targeted tests
        run: pytest tests/unit/quality/test_verify.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
