name: Task 11 RED Contract

on:
  push:
    branches:
      - verification/task11-red

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 11 tests-only SHA
        uses: actions/checkout@v4
        with:
          ref: a2e29e128ee5036a039706f566b46523c32b2bad
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 11 RED tests
        run: pytest tests/unit/quality/test_dedup.py -q
