name: Task 7 Develop Exact HEAD Gate

on:
  push:
    branches:
      - verification/task7-review-fix-red

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop exact Task 7 HEAD
        uses: actions/checkout@v4
        with:
          ref: 8532346af230dfaca1d72095a95b38823a836172
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 7 tests
        run: pytest tests/unit/normalize tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
