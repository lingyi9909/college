name: Task 7 Review RED

on:
  push:
    branches:
      - verification/task7-review-fix-red

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RED branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Run Task 7 RED tests
        run: pytest tests/unit/normalize/test_task7_review_regressions.py -q
