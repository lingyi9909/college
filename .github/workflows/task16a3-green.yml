name: Task16A3 GREEN

on:
  push:
    branches:
      - ci/task16a3-green
    paths:
      - .github/workflows/task16a3-green.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f8293d835760165311d9e0ae2152e0bd70f79aa
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "7f8293d835760165311d9e0ae2152e0bd70f79aa"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A3 focused regressions
        run: pytest tests/unit/quality/test_analysis.py tests/e2e/test_task15_provider_prompt_protocol.py tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
