name: Task16A3 GREEN

on:
  push:
    branches:
      - ci/task16a3-green
    paths:
      - .github/workflows/task16a3-green.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b598aa61f6c4f09a49f7be2eb7c1c80adc46c57d
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "b598aa61f6c4f09a49f7be2eb7c1c80adc46c57d"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A3 focused regressions
        run: pytest tests/unit/quality/test_analysis.py tests/unit/quality/test_task16a3_analysis_evidence_relevance.py tests/e2e/test_task15_provider_prompt_protocol.py tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
