name: Task 12 Answer Authority GREEN

on:
  push:
    branches:
      - verification/task12-answer-authority-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 12 answer-authority candidate
        uses: actions/checkout@v4
        with:
          ref: e37810f4594f18ee32c5d520889117972c68132b
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Requested targeted tests
        run: pytest tests/unit/quality/test_verify.py tests/unit/quality/test_answer.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
