name: Task 9 GREEN Gate 3

on:
  push:
    branches:
      - verification/task9-green3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 9 candidate
        uses: actions/checkout@v4
        with:
          ref: e94517c27b20ae9d36662cc737973f1dbafe0098
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 9 tests
        run: pytest tests/unit/providers tests/unit/quality/test_classify.py -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
