name: Task 12 Parser Green

on:
  push:
    branches:
      - verification/task12-parser-green

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 12 parser candidate
        uses: actions/checkout@v4
        with:
          ref: db79d202fa728ce06688a0bcbf66a6b968fff936
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Parser regression
        run: pytest tests/unit/quality/test_verify.py::test_deterministic_function_calls_are_not_evaluated -q
      - name: Task 12 targeted tests
        run: pytest tests/unit/quality/test_verify.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
