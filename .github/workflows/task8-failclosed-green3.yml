name: Task 8 Fail-Closed GREEN Gate 3

on:
  push:
    branches:
      - verification/task8-failclosed-green3

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 8 candidate
        uses: actions/checkout@v4
        with:
          ref: 3ddcf8a97e0f5a4e0ebdb1dcde3ed57747b6a646
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 8 tests
        run: pytest tests/unit/quality/test_engine.py tests/unit/quality/test_integrity.py -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
