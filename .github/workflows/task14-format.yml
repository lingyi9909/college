name: Task 14 Format
on:
  push:
    branches: [verification/task14-format]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/task14-pipeline-runner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.8,<1'
      - name: Format Task 14 files only
        run: |
          ruff format src/college_builder/pipeline/runner.py tests/e2e/test_pipeline_resume.py src/college_builder/cli.py src/college_builder/reporting/pilot_report.py
          git diff --check
          git status --short
      - name: Commit formatting to feature
        run: |
          git config user.name lingyi9909
          git config user.email zhanhui9909@gmail.com
          if ! git diff --quiet; then
            git add src/college_builder/pipeline/runner.py tests/e2e/test_pipeline_resume.py src/college_builder/cli.py src/college_builder/reporting/pilot_report.py
            git commit -m 'style: format Task 14 implementation'
            git push origin HEAD:feature/task14-pipeline-runner
          fi
