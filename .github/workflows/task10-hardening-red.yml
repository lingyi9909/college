name: Task 10 Hardening RED
on:
  push:
    branches:
      - verification/task10-hardening-red
jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 10 hardening RED exact head
        uses: actions/checkout@v4
        with:
          ref: dee37957414102abe37014ecf3c37ba6074840b9
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Run hardening RED regressions
        run: pytest tests/unit/quality/test_answer.py tests/unit/quality/test_analysis.py -q
