name: Task 15 Source-Only Sample Preview

on:
  push:
    branches:
      - ci/task15-sample-preview

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d1c047563d34d3de9bed01200256a50d84fb435
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Reproduce 100-record engineering sample without model calls
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          from college_builder.normalize.normalizer import normalize
          from college_builder.quality.answer import extract_source_answer
          from college_builder.source.stackmathqa import OFFICIAL_SOURCE_FILES, StackMathQAAdapter

          quotas = {'math': 40, 'physics': 20, 'statistics': 20, 'mathoverflow': 20}
          preview_quota = 3
          revision = 'git:13239ec8c8078bc8dfb43e1383069eb9be000ff7'
          base = ('https://huggingface.co/datasets/math-ai/StackMathQA/resolve/'
                  '13239ec8c8078bc8dfb43e1383069eb9be000ff7/'
                  'preprocessed/stackexchange-math--1q1a')
          selected = []
          counts = {key: 0 for key in quotas}
          previews = defaultdict(list)
          for filename, (stratum, _host) in OFFICIAL_SOURCE_FILES.items():
              adapter = StackMathQAAdapter()
              descriptor = tuple(adapter.discover({
                  'data_file': f'{base}/{filename}',
                  'revision': revision,
                  'license_metadata': {'declared': 'CC-BY-4.0', 'status': 'UPSTREAM_DECLARED'},
              }))[0]
              for record in adapter.acquire(descriptor):
                  if counts[stratum] >= quotas[stratum]:
                      break
                  if record.metadata.get('language') != 'en':
                      continue
                  if len(record.raw_question) > 1600 or len(record.raw_analysis) > 3200:
                      continue
                  normalized = normalize(record)
                  answer = extract_source_answer(normalized)
                  if answer.final_answer is None:
                      continue
                  counts[stratum] += 1
                  selected.append(record.record_id)
                  if len(previews[stratum]) < preview_quota:
                      previews[stratum].append({
                          'stratum': stratum,
                          'record_id': record.record_id,
                          'source_url': record.source_url,
                          'question': record.raw_question,
                          'source_answer': record.raw_answer,
                          'source_analysis': record.raw_analysis,
                          'extracted_final_answer': answer.final_answer,
                      })
          assert counts == quotas, (counts, quotas)
          assert len(selected) == 100
          flat = []
          for key in ('math', 'physics', 'statistics', 'mathoverflow'):
              flat.extend(previews[key])
          Path('/tmp/task15-preview.json').write_text(
              json.dumps({'sample_size': 100, 'counts': counts, 'preview_records': flat},
                         ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('TASK15_SOURCE_ONLY_PREVIEW=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task15-source-only-preview
          path: /tmp/task15-preview.json
          if-no-files-found: error
          retention-days: 7
