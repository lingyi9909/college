name: Task 7 Candidate Gate

on:
  push:
    branches:
      - verification/task7-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 7 candidate
        uses: actions/checkout@v4
        with:
          ref: 56af6a8f165bae44d728aa52363b0a74438a1dbe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 7 pytest
        run: pytest tests/unit/normalize tests/golden -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
