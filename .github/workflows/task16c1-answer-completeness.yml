name: Task16C1 Answer Completeness

on:
  push:
    branches: [feature/task16c1-answer-completeness]

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task16C1 focused regression
        run: >-
          pytest -q
          tests/unit/quality/test_task16_answer_recall.py
          tests/unit/quality/test_task16_task15_answer_evidence.py
          tests/unit/quality/test_task16a4_downstream_span_protocol.py
          tests/e2e/test_gold_regression.py
      - name: Fresh full pytest
        run: pytest -q
      - name: Fresh Ruff
        run: ruff check src tests
      - name: Fresh MyPy
        run: mypy src
