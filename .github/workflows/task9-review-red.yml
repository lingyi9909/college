name: Task 9 Review RED

on:
  push:
    branches:
      - verification/task9-review-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 9 review RED
        uses: actions/checkout@v4
        with:
          ref: fe575b82d46588290abb864b7c233f0851f90aea
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 9 review regressions
        run: pytest tests/unit/quality/test_classify.py -q
