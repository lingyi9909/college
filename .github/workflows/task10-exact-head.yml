name: Task 10 Exact HEAD Gate
on:
  push:
    branches:
      - verification/task10-exact-head
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new develop exact HEAD
        uses: actions/checkout@v4
        with:
          ref: fa7e236857665fa35c043f1ebfae53ad08939e5f
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 10 tests
        run: pytest tests/unit/quality/test_answer.py tests/unit/quality/test_analysis.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
