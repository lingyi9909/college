name: Task16C Small-20 Real-Model Validation

on:
  push:
    branches: [ci/task16c-small200]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.TASK15_OPENAI_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.TASK15_OPENAI_API_KEY }}
      TASK16C_PRODUCTION_SHA: 01f453ef241659e673ddcb1e012f1f270f3316dc
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: 01f453ef241659e673ddcb1e012f1f270f3316dc
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact production code
        working-directory: work
        run: python -m pip install -e '.[dev]'

      - name: Guard production identity and model secrets
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK16C_PRODUCTION_SHA"
          test -n "$OPENAI_COMPATIBLE_BASE_URL"
          test -n "$OPENAI_COMPATIBLE_API_KEY"

      - name: Pre-model focused regressions
        working-directory: work
        run: >-
          pytest -q
          tests/unit/quality/test_task16_answer_recall.py
          tests/unit/quality/test_task16a4_downstream_span_protocol.py
          tests/unit/quality/test_task16c_small200_authority_hint.py
          tests/e2e/test_task15_provider_prompt_protocol.py
          tests/e2e/test_gold_regression.py

      - name: Build frozen source pool and select fixed 20
        working-directory: work
        run: |
          python ../ci-source/ci/task16c_prepare_200.py
          python ../ci-source/ci/task16c_select_20.py

      - name: Guard fixed Small-20 before model calls
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/task16c-small200')
          manifest = json.loads((root/'sample_manifest.json').read_text(encoding='utf-8'))
          payload = (root/'sample.jsonl').read_bytes()
          assert manifest['schema_version'] == 'task16c-small20-regression-v1'
          assert manifest['selection_frozen_before_model_calls'] is True
          assert manifest['total'] == 20
          assert len(manifest['records']) == 20
          assert len({r['record_id'] for r in manifest['records']}) == 20
          assert hashlib.sha256(payload).hexdigest() == manifest['sample_payload_sha256']
          print('TASK16C_SMALL20_SAMPLE_GUARD=PASS')
          print('TASK16C_SMALL20_SAMPLE_SHA256=' + manifest['sample_payload_sha256'])
          print('TASK16C_SMALL20_IDENTITY_SHA256=' + manifest['record_identity_sha256'])
          PY

      - name: Execute exact production pipeline on fixed 20
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          college-builder run \
            --input /tmp/task16c-small200/sample.jsonl \
            --config config/task16-recertification.yaml \
            --workspace /tmp/task16c-small200-workspace \
            --output /tmp/task16c-small200-output

      - name: Build Small-20 evidence
        working-directory: work
        run: python ../ci-source/ci/task16c_report_200.py

      - name: Engineering guards
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/task16c-small200-certification/run_report.json').read_text(encoding='utf-8'))
          assert r['exact_production_code_sha'] == '01f453ef241659e673ddcb1e012f1f270f3316dc'
          assert r['sample']['count'] == 20
          assert r['sample']['selection_frozen_before_model_calls'] is True
          assert all(r['engineering_gate'].values())
          assert r['pipeline']['accepted_count'] > 0, 'Small-20 produced no accepted records'
          assert r['export']['count'] == r['pipeline']['accepted_count']
          assert r['pipeline']['provider_errors'] == 0
          print('TASK16C_SMALL20_ENGINEERING_GUARD=PASS')
          print(json.dumps(r['pipeline']['funnel'], sort_keys=True))
          print(json.dumps(r['pipeline']['reject_reason_counts'], sort_keys=True))
          PY

      - name: Fresh full pytest
        working-directory: work
        run: pytest -q
      - name: Fresh Ruff
        working-directory: work
        run: ruff check src tests
      - name: Fresh MyPy
        working-directory: work
        run: mypy src

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task16c-small20-validation
          path: |
            /tmp/task16c-small200/
            /tmp/task16c-small200-certification/
            /tmp/task16c-small200-output/
            /tmp/task16c-small200-workspace/
          if-no-files-found: warn
          retention-days: 30
