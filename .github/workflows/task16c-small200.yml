name: Task16C Small-200 Real-Model Validation

on:
  push:
    branches: [ci/task16c-small200]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.TASK15_OPENAI_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.TASK15_OPENAI_API_KEY }}
      TASK16C_PRODUCTION_SHA: c65c70c5ff007142bdfbc61857d2990f49495d7d
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: c65c70c5ff007142bdfbc61857d2990f49495d7d
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact production code
        working-directory: work
        run: python -m pip install -e '.[dev]'

      - name: Guard exact production identity and model secrets
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK16C_PRODUCTION_SHA"
          test -n "$OPENAI_COMPATIBLE_BASE_URL"
          test -n "$OPENAI_COMPATIBLE_API_KEY"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('config/task16-recertification.yaml').read_text(encoding='utf-8'))
          assert config['config_version'] == 'task16-recertification-v2'
          assert config['providers']['classifier']['model'] == 'deepseek-flash'
          assert config['providers']['verifier']['model'] == 'deepseek-v4-pro'
          assert config['prompt_versions'] == {
              'university_classify': 'v1',
              'problem_classify': 'v1',
              'analysis_classify': 'v3',
              'qa_alignment': 'v2',
              'correctness_verify': 'v2',
          }
          print('TASK16C_PRODUCTION_IDENTITY_GUARD=PASS')
          print('TASK16C_CONFIG_SHA256=' + hashlib.sha256(Path('config/task16-recertification.yaml').read_bytes()).hexdigest())
          PY

      - name: Pre-model Task16 focused regressions
        working-directory: work
        run: >-
          pytest -q
          tests/unit/quality/test_task16_gate2_conflict.py
          tests/unit/quality/test_task16_answer_recall.py
          tests/unit/quality/test_task16_task15_answer_evidence.py
          tests/unit/quality/test_task16a3_analysis_evidence_relevance.py
          tests/unit/quality/test_task16a4_downstream_span_protocol.py
          tests/e2e/test_task15_provider_prompt_protocol.py
          tests/e2e/test_gold_regression.py

      - name: Build and freeze deterministic 200-record sample
        working-directory: work
        run: python ../ci-source/ci/task16c_prepare_200.py

      - name: Guard frozen sample before model calls
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/task16c-small200')
          manifest = json.loads((root/'sample_manifest.json').read_text(encoding='utf-8'))
          payload = (root/'sample.jsonl').read_bytes()
          assert manifest['schema_version'] == 'task16c-small-production-validation-v1'
          assert manifest['selection_frozen_before_model_calls'] is True
          assert manifest['total'] == 200
          assert len(manifest['records']) == 200
          assert len({r['record_id'] for r in manifest['records']}) == 200
          assert hashlib.sha256(payload).hexdigest() == manifest['sample_payload_sha256']
          assert manifest['strata'] == {
              'stackmathqa': {'math': 80, 'mathoverflow': 20, 'statistics': 40, 'physics': 40},
              'openstax': 20,
          }
          print('TASK16C_SMALL200_SAMPLE_GUARD=PASS')
          print('TASK16C_SMALL200_SAMPLE_SHA256=' + manifest['sample_payload_sha256'])
          print('TASK16C_SMALL200_IDENTITY_SHA256=' + manifest['record_identity_sha256'])
          PY

      - name: Execute exact production pipeline on frozen 200
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          college-builder run \
            --input /tmp/task16c-small200/sample.jsonl \
            --config config/task16-recertification.yaml \
            --workspace /tmp/task16c-small200-workspace \
            --output /tmp/task16c-small200-output

      - name: Build certification evidence
        working-directory: work
        run: python ../ci-source/ci/task16c_report_200.py

      - name: Engineering structural guards
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/task16c-small200-certification/run_report.json').read_text(encoding='utf-8'))
          assert r['exact_production_code_sha'] == 'c65c70c5ff007142bdfbc61857d2990f49495d7d'
          assert r['sample']['count'] == 200
          assert r['sample']['selection_frozen_before_model_calls'] is True
          assert all(r['engineering_gate'].values())
          assert r['pipeline']['accepted_count'] > 0, 'small validation produced no accepted/exported records'
          assert r['export']['count'] == r['pipeline']['accepted_count']
          assert r['export']['exact_19_field_export_valid'] is True
          assert r['pipeline']['provider_errors'] == 0
          if not r['pipeline']['tokens_available']:
              assert r['pipeline']['tokens'] is None
          if not r['pipeline']['estimated_cost_usd_available']:
              assert r['pipeline']['estimated_cost_usd'] is None
          print('TASK16C_SMALL200_ENGINEERING_GUARD=PASS')
          print(json.dumps(r['pipeline']['funnel'], sort_keys=True))
          print(json.dumps(r['pipeline']['reject_reason_counts'], sort_keys=True))
          PY

      - name: Fresh full pytest
        working-directory: work
        run: pytest -q
      - name: Fresh Ruff
        working-directory: work
        run: ruff check src tests
      - name: Fresh MyPy
        working-directory: work
        run: mypy src

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task16c-small200-validation
          path: |
            /tmp/task16c-small200/
            /tmp/task16c-small200-certification/
            /tmp/task16c-small200-output/
            /tmp/task16c-small200-workspace/
          if-no-files-found: warn
          retention-days: 30
