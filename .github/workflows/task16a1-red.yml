name: Task16A1 RED

on:
  push:
    branches:
      - feature/task16-recall-hardening
    paths:
      - tests/unit/quality/test_task16_gate2_conflict.py
      - .github/workflows/task16a1-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Confirm compatible-positive regression is RED
        shell: bash
        run: |
          set +e
          pytest tests/unit/quality/test_task16_gate2_conflict.py::test_gate2_compatible_positive_labels_are_not_model_conflict -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected Task16A.1 compatible-positive regression to fail before implementation.'
            exit 1
          fi
          echo 'TASK16_A1_COMPATIBLE_POSITIVE_RED=PASS'
      - name: Confirm negative disagreement guard remains GREEN
        run: pytest tests/unit/quality/test_task16_gate2_conflict.py::test_gate2_positive_negative_disagreement_still_fails_closed -q
