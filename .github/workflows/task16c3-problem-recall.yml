name: Task16C3 Problem Recall

on:
  push:
    branches: [feature/task16c3-problem-recall]

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task16C3 focused regression
        run: >-
          pytest -q
          tests/unit/quality/test_task16c3_problem_recall.py
          tests/unit/quality/test_classify.py
          tests/unit/quality/test_task16_gate2_conflict.py
          tests/e2e/test_gold_regression.py
      - name: Fresh full pytest
        run: pytest -q
      - name: Fresh Ruff
        run: ruff check src tests
      - name: Fresh MyPy
        run: mypy src
