name: Task 15 StackMathQA Answer Flow RED

on:
  push:
    branches:
      - ci/task15-100-preview-zero-model

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d1c047563d34d3de9bed01200256a50d84fb435
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Add ephemeral regression
        shell: bash
        run: |
          cat >> tests/e2e/test_pipeline_resume.py <<'PY'

          class RequireExtractedAnswerAtAnalysisProvider(RuleProvider):
              def classify(self, request: ModelClassificationRequest) -> ModelDecision:
                  if request.task == "gate_4_original_analysis":
                      assert request.inputs.get("answer") == "4"
                  return super().classify(request)


          def test_stackmathqa_solution_only_flow_supplies_extracted_answer_to_analysis_gate(
              tmp_path: Path,
          ) -> None:
              base = _record(3, "VALID")
              analysis = "Add one to 3; therefore 4"
              record = base.model_copy(
                  update={"raw_answer": "", "raw_analysis": analysis}
              )
              config = _config()
              workspace = tmp_path / "workspace"
              primary = RequireExtractedAnswerAtAnalysisProvider(
                  provider="fixture-primary", model="primary-v1"
              )
              verifier = RuleProvider(provider="fixture-verifier", model="verifier-v1")
              runner = PipelineRunner(
                  config=config,
                  workspace=workspace,
                  processor=_processor(
                      config=config,
                      workspace=workspace,
                      primary=primary,
                      verifier=verifier,
                  ),
              )

              result = runner.run(
                  adapter=CountingAdapter((record,)),
                  source_config={},
                  output_dir=tmp_path / "output",
              )

              assert result.accepted_count == 1
              rows = [
                  json.loads(line)
                  for line in result.output_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
              assert len(rows) == 1
              assert rows[0]["text_answer"] == "4"
              assert rows[0]["answer_analysis"] == analysis
          PY
      - name: Verify RED is the expected production bug
        shell: bash
        run: |
          set +e
          pytest -q tests/e2e/test_pipeline_resume.py -k stackmathqa_solution_only_flow_supplies_extracted_answer_to_analysis_gate > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo "Regression unexpectedly passed; RED not proven" >&2
            exit 1
          fi
          grep -q "assert result.accepted_count == 1" /tmp/red.log
          grep -q "1 failed" /tmp/red.log
          echo TASK15_STACKMATHQA_ANSWER_FLOW_RED=PASS
