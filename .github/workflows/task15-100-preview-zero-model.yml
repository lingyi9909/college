name: Task 15 Answer Flow Fix and Verify v2

on:
  push:
    branches: [ci/task15-100-preview-zero-model]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task15-pilot-freeze
          fetch-depth: 0
      - name: Assert exact starting HEAD
        run: |
          test "$(git rev-parse HEAD)" = "3d1c047563d34d3de9bed01200256a50d84fb435"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply minimal production fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/college_builder/pipeline/runner.py')
          s = p.read_text(encoding='utf-8')
          pairs = [
            (
              '    def analysis(self, candidate: NormalizedQA) -> _AnalysisOutcome:\n        context = GateContext(config_version=self.config.config_version)\n        result = GateEngine[NormalizedQA](gates=(self._analysis,), context=context).run(candidate)\n',
              '    def analysis(\n        self, candidate: NormalizedQA, answer: AnswerContent\n    ) -> _AnalysisOutcome:\n        final_answer = answer.final_answer\n        if not isinstance(final_answer, str) or not final_answer.strip():\n            return _AnalysisOutcome(None, (), "ANSWER_SOURCE_UNTRACEABLE")\n        analysis_candidate = candidate.model_copy(update={"answer": final_answer})\n        context = GateContext(config_version=self.config.config_version)\n        result = GateEngine[NormalizedQA](gates=(self._analysis,), context=context).run(\n            analysis_candidate\n        )\n'
            ),
            (
              '            lambda raw: self._stage_analysis(run_dir, raw.record_id, normalized[raw.record_id]),\n',
              '            lambda raw: self._stage_analysis(\n                run_dir, raw.record_id, normalized[raw.record_id], answers[raw.record_id]\n            ),\n'
            ),
            ('            fp = self._analysis_fingerprint(candidate)\n', '            fp = self._analysis_fingerprint(candidate, answers[raw.record_id])\n'),
            (
              '    def _stage_analysis(\n        self,\n        run_dir: Path,\n        record_id: str,\n        candidate: NormalizedQA,\n    ) -> _AnalysisOutcome:\n        fingerprint = self._analysis_fingerprint(candidate)\n',
              '    def _stage_analysis(\n        self,\n        run_dir: Path,\n        record_id: str,\n        candidate: NormalizedQA,\n        answer: AnswerContent,\n    ) -> _AnalysisOutcome:\n        fingerprint = self._analysis_fingerprint(candidate, answer)\n'
            ),
            ('        outcome = self.processor.analysis(candidate)\n', '        outcome = self.processor.analysis(candidate, answer)\n'),
            (
              '    def _analysis_fingerprint(self, candidate: NormalizedQA) -> str:\n        return _hash_json(\n            {\n                "content": _candidate_hash(candidate),\n                "threshold": self.config.thresholds.analysis,\n',
              '    def _analysis_fingerprint(\n        self, candidate: NormalizedQA, answer: AnswerContent\n    ) -> str:\n        return _hash_json(\n            {\n                "content": _candidate_hash(candidate),\n                "answer_authority": answer.model_dump(mode="json"),\n                "threshold": self.config.thresholds.analysis,\n'
            ),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'patch context count={s.count(old)} for {old[:60]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          t = Path('tests/e2e/test_pipeline_resume.py')
          q = t.read_text(encoding='utf-8')
          marker = 'test_stackmathqa_solution_only_flow_supplies_extracted_answer_to_analysis_gate'
          assert marker not in q
          q += '''\n\nclass CaptureAnalysisAnswerProvider(RuleProvider):\n    def __init__(self, *, provider: str, model: str) -> None:\n        super().__init__(provider=provider, model=model)\n        self.analysis_answers: list[object] = []\n\n    def classify(self, request: ModelClassificationRequest) -> ModelDecision:\n        if request.task == "gate_4_original_analysis":\n            self.analysis_answers.append(request.inputs.get("answer"))\n        return super().classify(request)\n\n\ndef test_stackmathqa_solution_only_flow_supplies_extracted_answer_to_analysis_gate(\n    tmp_path: Path,\n) -> None:\n    base = _record(3, "VALID")\n    analysis = "Add one to 3; therefore 4"\n    record = base.model_copy(update={"raw_answer": "", "raw_analysis": analysis})\n    config = _config()\n    workspace = tmp_path / "workspace"\n    primary = CaptureAnalysisAnswerProvider(provider="fixture-primary", model="primary-v1")\n    verifier = RuleProvider(provider="fixture-verifier", model="verifier-v1")\n    runner = PipelineRunner(\n        config=config, workspace=workspace,\n        processor=_processor(config=config, workspace=workspace, primary=primary, verifier=verifier),\n    )\n    result = runner.run(\n        adapter=CountingAdapter((record,)), source_config={}, output_dir=tmp_path / "output"\n    )\n    assert primary.analysis_answers == ["4"]\n    assert result.accepted_count == 1\n    rows = [json.loads(line) for line in result.output_path.read_text(encoding="utf-8").splitlines() if line.strip()]\n    assert len(rows) == 1\n    assert len(rows[0]) == 19\n    assert rows[0]["text_answer"] == "4"\n    assert rows[0]["answer_analysis"] == analysis\n'''
          t.write_text(q, encoding='utf-8', newline='\n')
          PY
      - name: GREEN targeted regression
        run: pytest -q tests/e2e/test_pipeline_resume.py -k stackmathqa_solution_only_flow_supplies_extracted_answer_to_analysis_gate
      - name: Relevant regressions
        run: pytest -q tests/e2e/test_pipeline_resume.py tests/e2e/test_final_export.py tests/e2e/test_gold_regression.py tests/e2e/test_task15_pipeline_concurrency.py
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
      - name: Commit to Task 15 feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name lingyi9909
          git config user.email zhanhui9909@gmail.com
          git add src/college_builder/pipeline/runner.py tests/e2e/test_pipeline_resume.py
          git commit -m "fix: propagate extracted answer into analysis gate"
          git push origin HEAD:feature/task15-pilot-freeze
          echo TASK15_FIX_HEAD=$(git rev-parse HEAD)
