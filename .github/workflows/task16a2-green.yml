name: Task16A2 GREEN

on:
  push:
    branches:
      - feature/task16-recall-hardening
    paths:
      - src/college_builder/quality/answer.py
      - tests/unit/quality/test_task16_answer_recall.py
      - .github/workflows/task16a2-green.yml

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A2 regression
        run: pytest tests/unit/quality/test_task16_answer_recall.py -q
      - name: Existing answer and Gold regression
        run: pytest tests/unit/quality/test_answer.py tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
