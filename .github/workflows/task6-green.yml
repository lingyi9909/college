name: Task 6 Develop Exact HEAD Gate

on:
  push:
    branches:
      - verification/task6-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop exact Task 6 HEAD
        uses: actions/checkout@v4
        with:
          ref: 6ac57f703cb382ad1cfcb8136363aa01b5e513ee
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 6 pytest
        run: pytest tests/unit/source/test_gold.py tests/unit/source/test_openstax.py -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
