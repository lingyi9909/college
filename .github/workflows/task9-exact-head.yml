name: Task 9 Develop Exact HEAD Gate

on:
  push:
    branches:
      - verification/task9-exact-head

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop exact HEAD
        uses: actions/checkout@v4
        with:
          ref: 21cbafbf17ae7723b81474c56b9e25cca8f34f27
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 9 tests
        run: pytest tests/unit/providers tests/unit/quality/test_classify.py -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
