name: Task 11 Review Fix Exact HEAD Gate

on:
  push:
    branches:
      - verification/task11-review-fix-exact-head

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 11 exact develop HEAD
        uses: actions/checkout@v4
        with:
          ref: 58341769a001fbd5ea9215320c3f6270d75ab16e
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 11 targeted tests
        run: pytest tests/unit/quality/test_dedup.py tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
