name: Task 15 Analysis JSON Prompt GREEN

on:
  push:
    branches:
      - ci/task15-analysis-json-prompt-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 934be6daba7598ab735a4d6d854a17ab3cb60b5e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Targeted JSON prompt contract
        run: pytest -q tests/e2e/test_task15_provider_prompt_protocol.py tests/e2e/test_pilot_5k.py
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
