name: Task16C Small-200 Authority Hint

on:
  push:
    branches: [hotfix/task16c-small200-authority-hint]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused authority-hint regressions
        run: pytest -q tests/unit/quality/test_task16c_small200_authority_hint.py tests/unit/quality/test_task16a4_downstream_span_protocol.py
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
