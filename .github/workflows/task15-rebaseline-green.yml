name: Task 15 Rebaseline GREEN A-B

on:
  push:
    branches: [ci/task15-rebaseline-green]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task15-pilot-freeze
          fetch-depth: 0
      - name: Assert starting feature HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9cbc3ea248a569de5adb878cb456b929761379b1"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply minimal production fixes and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path('src/college_builder/pipeline/runner.py')
          text = runner.read_text(encoding='utf-8')
          old = '''            audits[raw.record_id]["accepted"] = True\n            self._save_audit(run_dir, raw.record_id, audits[raw.record_id])\n            accepted_by_id[raw.record_id] = ir\n'''
          new = '''            training_eligible = not _is_calibration_holdout(raw)\n            audits[raw.record_id]["accepted"] = training_eligible\n            self._save_audit(run_dir, raw.record_id, audits[raw.record_id])\n            accepted_by_id[raw.record_id] = ir\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '''        accepted_irs = [\n            accepted_by_id[raw.record_id] for raw in raw_records if raw.record_id in accepted_by_id\n        ]\n'''
          new = '''        accepted_irs = [\n            accepted_by_id[raw.record_id]\n            for raw in raw_records\n            if raw.record_id in accepted_by_id and not _is_calibration_holdout(raw)\n        ]\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          marker = '''def _subject_from_raw(raw: RawSourceRecord) -> str:\n'''
          helper = '''def _is_calibration_holdout(raw: RawSourceRecord) -> bool:\n    metadata = raw.model_dump(mode="json").get("metadata")\n    if not isinstance(metadata, dict):\n        return False\n    return metadata.get("calibration_holdout") is True or metadata.get("gold_role") == "CALIBRATION_GOLD"\n\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper + marker, 1)
          runner.write_text(text, encoding='utf-8', newline='\n')

          pilot = Path('src/college_builder/pipeline/pilot.py')
          text = pilot.read_text(encoding='utf-8')
          constants = '''DEFAULT_FIVE_K_SEED = 20260910\n'''
          constants_new = '''DEFAULT_FIVE_K_SEED = 20260910\nCERTIFICATION_TOTAL = 100\nCERTIFICATION_QUOTAS: dict[str, int] = {\n    "math": 40,\n    "physics": 20,\n    "statistics": 20,\n    "mathoverflow": 20,\n}\n'''
          assert text.count(constants) == 1
          text = text.replace(constants, constants_new, 1)
          marker = '''def build_pilot_sample(\n'''
          insertion = '''class CertificationSamplePlan(BaseModel):\n    """Deterministic real-model certification child sample plan."""\n\n    model_config = ConfigDict(frozen=True, extra="forbid")\n\n    seed: int = DEFAULT_FIVE_K_SEED\n    quotas: dict[str, PositiveInt] = Field(\n        default_factory=lambda: dict(CERTIFICATION_QUOTAS)\n    )\n\n    @model_validator(mode="after")\n    def _validate_sites(self) -> "CertificationSamplePlan":\n        if not self.quotas:\n            raise ValueError("certification quotas must not be empty")\n        if not set(self.quotas).issubset(CERTIFICATION_QUOTAS):\n            raise ValueError("certification quotas contain an unsupported StackMathQA stratum")\n        return self\n\n    @property\n    def total(self) -> int:\n        return sum(self.quotas.values())\n\n\nclass CertificationSampleManifest(BaseModel):\n    """Safe lineage manifest for the deterministic 100-of-5K sample."""\n\n    model_config = ConfigDict(frozen=True, extra="forbid")\n\n    parent_sample_sha256: SHA256Hex\n    seed: int\n    quotas: dict[str, PositiveInt]\n    total: PositiveInt\n    sample_sha256: SHA256Hex\n    sampled_record_ids: tuple[str, ...]\n    sampled_raw_sha256: tuple[SHA256Hex, ...]\n\n    @model_validator(mode="after")\n    def _validate_manifest(self) -> "CertificationSampleManifest":\n        if self.total != sum(self.quotas.values()):\n            raise ValueError("certification manifest total does not equal quota sum")\n        if self.total != len(self.sampled_record_ids):\n            raise ValueError("certification manifest total does not equal sampled record count")\n        if self.total != len(self.sampled_raw_sha256):\n            raise ValueError("certification manifest total does not equal sampled hash count")\n        return self\n\n\nclass CertificationSample(BaseModel):\n    """Runtime child records plus a commit-safe lineage manifest."""\n\n    model_config = ConfigDict(frozen=True, extra="forbid")\n\n    records: tuple[RawSourceRecord, ...]\n    manifest: CertificationSampleManifest\n\n\ndef build_certification_sample(\n    parent: PilotSample,\n    *,\n    plan: CertificationSamplePlan,\n) -> CertificationSample:\n    """Select a deterministic stratified child sample strictly from a certified parent."""\n    parent_ids = parent.manifest.sampled_record_ids\n    parent_hashes = parent.manifest.sampled_raw_sha256\n    if len(parent.records) != parent.manifest.total:\n        raise ValueError("parent pilot sample record count does not match manifest")\n    parent_identity = dict(zip(parent_ids, parent_hashes, strict=True))\n    if len(parent_identity) != parent.manifest.total:\n        raise ValueError("parent pilot manifest contains duplicate record_id values")\n    for record in parent.records:\n        if parent_identity.get(record.record_id) != record.raw_sha256:\n            raise ValueError("parent pilot record identity does not match manifest")\n\n    sampled = _bounded_child_priority_sample(\n        parent.records,\n        plan=plan,\n        parent_sample_sha256=parent.manifest.sample_sha256,\n    )\n    record_ids = tuple(record.record_id for record in sampled)\n    raw_hashes = tuple(record.raw_sha256 for record in sampled)\n    digest = hashlib.sha256(\n        json.dumps(\n            {\n                "parent_sample_sha256": parent.manifest.sample_sha256,\n                "seed": plan.seed,\n                "quotas": plan.quotas,\n                "records": list(zip(record_ids, raw_hashes, strict=True)),\n            },\n            sort_keys=True,\n            separators=(",", ":"),\n        ).encode()\n    ).hexdigest()\n    manifest = CertificationSampleManifest(\n        parent_sample_sha256=parent.manifest.sample_sha256,\n        seed=plan.seed,\n        quotas=plan.quotas,\n        total=len(sampled),\n        sample_sha256=digest,\n        sampled_record_ids=record_ids,\n        sampled_raw_sha256=raw_hashes,\n    )\n    return CertificationSample(records=sampled, manifest=manifest)\n\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insertion + marker, 1)
          marker = '''def _bounded_priority_sample(\n'''
          helper = '''def _bounded_child_priority_sample(\n    records: Iterable[RawSourceRecord],\n    *,\n    plan: CertificationSamplePlan,\n    parent_sample_sha256: str,\n) -> tuple[RawSourceRecord, ...]:\n    heaps: dict[str, list[tuple[int, str, str, RawSourceRecord]]] = {\n        site: [] for site in plan.quotas\n    }\n    counts = {site: 0 for site in plan.quotas}\n    seen_ids: set[str] = set()\n    for record in records:\n        site = record.metadata.get("source_site")\n        if not isinstance(site, str) or site not in plan.quotas:\n            continue\n        if record.record_id in seen_ids:\n            raise ValueError(f"duplicate certification source record_id: {record.record_id}")\n        seen_ids.add(record.record_id)\n        counts[site] += 1\n        priority = int(\n            hashlib.sha256(\n                f"{parent_sample_sha256}\\0{plan.seed}\\0{site}\\0{record.record_id}".encode()\n            ).hexdigest(),\n            16,\n        )\n        entry = (-priority, record.record_id, record.raw_sha256, record)\n        heap = heaps[site]\n        quota = plan.quotas[site]\n        if len(heap) < quota:\n            heapq.heappush(heap, entry)\n        elif entry > heap[0]:\n            heapq.heapreplace(heap, entry)\n\n    for site, quota in plan.quotas.items():\n        if counts[site] < quota:\n            raise ValueError(\n                f"insufficient parent records for {site}: required {quota}, found {counts[site]}"\n            )\n\n    selected: list[RawSourceRecord] = []\n    for site in plan.quotas:\n        candidates = (\n            (-priority, record_id, raw_hash, record)\n            for priority, record_id, raw_hash, record in heaps[site]\n        )\n        ordered = sorted(candidates, key=lambda item: (item[0], item[1], item[2]))\n        selected.extend(item[3] for item in ordered)\n    return tuple(selected)\n\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper + marker, 1)
          pilot.write_text(text, encoding='utf-8', newline='\n')

          holdout_test = Path('tests/e2e/test_task15_calibration_holdout.py')
          holdout_test.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom college_builder.config import PipelineConfig\nfrom college_builder.pipeline.runner import GatePipelineProcessor, PipelineRunner\nfrom college_builder.providers.base import ModelClassificationRequest, ModelDecision\nfrom college_builder.source.gold import GoldDatasetAdapter\n\n\nclass PassProvider:\n    provider = "holdout-regression"\n\n    def __init__(self, model: str) -> None:\n        self.model = model\n        self.tasks: list[str] = []\n\n    def classify(self, request: ModelClassificationRequest) -> ModelDecision:\n        self.tasks.append(request.task)\n        question = str(request.inputs.get("question", ""))\n        answer = str(request.inputs.get("answer", ""))\n        analysis = str(request.inputs.get("analysis", ""))\n        if request.task == "gate_1_university_stem":\n            return ModelDecision(label="UNIVERSITY_STEM", score=0.999, evidence_references=("question:0-1",), reason_code="PASS")\n        if request.task == "gate_2_problem":\n            return ModelDecision(label="CALCULATION", score=0.999, evidence_references=("question:0-1",), reason_code="PASS")\n        if request.task == "gate_4_original_analysis":\n            return ModelDecision(label="STEP_BY_STEP", score=0.999, evidence_references=(f"analysis:0-{len(analysis)}",), reason_code="PASS")\n        if request.task in {"gate_5_qa_alignment", "independent_correctness_verification"}:\n            return ModelDecision(label="PASS", score=0.999, evidence_references=(f"question:0-{len(question)}", f"answer:0-{len(answer)}", f"analysis:0-{len(analysis)}"), reason_code="PASS")\n        raise AssertionError(request.task)\n\n\ndef _source_config(path: Path, role: str) -> dict[str, object]:\n    return {\n        "dataset_name": "stemq",\n        "data_file": str(path),\n        "source_url": "https://gold.invalid/stemq",\n        "revision": "git:" + "d" * 40,\n        "gold_role": role,\n        "language": "en",\n        "field_mapping": {"source_id": "id", "question": "question", "answer": "answer", "solution": "solution"},\n        "license_metadata": {"declared": "CC-BY-4.0"},\n    }\n\n\ndef _run(tmp_path: Path, role: str):\n    source = tmp_path / f"{role}.jsonl"\n    source.write_text(json.dumps({"id": role, "question": "Compute 2 + 2.", "answer": "4", "solution": "Add the two values. Therefore 4"}) + "\\n", encoding="utf-8")\n    config = PipelineConfig.load(Path("config/pilot-5k-frozen.yaml"))\n    primary = PassProvider("primary")\n    verifier = PassProvider("verifier")\n    workspace = tmp_path / f"workspace-{role}"\n    processor = GatePipelineProcessor(config=config, cache_path=workspace / "cache" / "calls.sqlite3", primary_provider=primary, verifier_provider=verifier, project_root=Path("."))\n    result = PipelineRunner(config=config, workspace=workspace, processor=processor).run(adapter=GoldDatasetAdapter(), source_config=_source_config(source, role), output_dir=tmp_path / f"out-{role}")\n    return result, primary, verifier\n\n\ndef test_calibration_gold_passes_all_quality_gates_but_is_not_training_exported(tmp_path: Path) -> None:\n    result, primary, verifier = _run(tmp_path, "CALIBRATION_GOLD")\n    expected = {"gate_1_university_stem", "gate_2_problem", "gate_4_original_analysis", "gate_5_qa_alignment", "independent_correctness_verification"}\n    assert expected.issubset(set(primary.tasks + verifier.tasks))\n    assert result.accepted_count == 0\n    assert result.output_path.read_text(encoding="utf-8").strip() == ""\n\n\ndef test_trusted_and_high_confidence_gold_receive_no_holdout_bypass(tmp_path: Path) -> None:\n    for role in ("TRUSTED_TRAINING", "HIGH_CONFIDENCE"):\n        result, primary, verifier = _run(tmp_path, role)\n        expected = {"gate_1_university_stem", "gate_2_problem", "gate_4_original_analysis", "gate_5_qa_alignment", "independent_correctness_verification"}\n        assert expected.issubset(set(primary.tasks + verifier.tasks))\n        assert result.accepted_count == 1\n        assert result.output_path.read_text(encoding="utf-8").strip()\n''', encoding='utf-8', newline='\n')

          test_pilot = Path('tests/unit/pipeline/test_pilot.py')
          text = test_pilot.read_text(encoding='utf-8')
          old = '''    FIVE_K_QUOTAS,\n    FIVE_K_TOTAL,\n    FiveKPilotPlan,\n    PilotSampleManifest,\n    build_pilot_sample,\n'''
          new = '''    CERTIFICATION_QUOTAS,\n    CERTIFICATION_TOTAL,\n    FIVE_K_QUOTAS,\n    FIVE_K_TOTAL,\n    CertificationSamplePlan,\n    FiveKPilotPlan,\n    PilotSampleManifest,\n    build_certification_sample,\n    build_pilot_sample,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text += '''\n\ndef test_certification_plan_defaults_to_exact_100_strata() -> None:\n    plan = CertificationSamplePlan()\n    assert CERTIFICATION_TOTAL == 100\n    assert CERTIFICATION_QUOTAS == {"math": 40, "physics": 20, "statistics": 20, "mathoverflow": 20}\n    assert plan.total == 100\n    assert plan.quotas == CERTIFICATION_QUOTAS\n\n\ndef test_certification_sample_is_deterministic_child_of_parent_sample() -> None:\n    records = _records()\n    revision = "git:" + "c" * 40\n    parent = build_pilot_sample(\n        records,\n        plan=FiveKPilotPlan(seed=20260910, quotas={"math": 20, "physics": 10, "statistics": 10, "mathoverflow": 10}),\n        source_revisions={"stackmathqa": revision},\n    )\n    plan = CertificationSamplePlan(seed=20260910, quotas={"math": 4, "physics": 2, "statistics": 2, "mathoverflow": 2})\n    first = build_certification_sample(parent, plan=plan)\n    second = build_certification_sample(parent, plan=plan)\n    assert first.manifest == second.manifest\n    assert first.manifest.parent_sample_sha256 == parent.manifest.sample_sha256\n    assert Counter(str(row.metadata["source_site"]) for row in first.records) == plan.quotas\n    parent_pairs = dict(zip(parent.manifest.sampled_record_ids, parent.manifest.sampled_raw_sha256, strict=True))\n    for record_id, raw_sha in zip(first.manifest.sampled_record_ids, first.manifest.sampled_raw_sha256, strict=True):\n        assert parent_pairs[record_id] == raw_sha\n\n\ndef test_certification_sample_identity_binds_parent_and_raw_hash() -> None:\n    records = _records()\n    revision = "git:" + "d" * 40\n    parent = build_pilot_sample(records, plan=FiveKPilotPlan(seed=1, quotas={"math": 4, "physics": 2, "statistics": 2, "mathoverflow": 2}), source_revisions={"stackmathqa": revision})\n    plan = CertificationSamplePlan(seed=9, quotas={"math": 1, "physics": 1, "statistics": 1, "mathoverflow": 1})\n    first = build_certification_sample(parent, plan=plan)\n    changed_manifest = parent.manifest.model_copy(update={"sample_sha256": "f" * 64})\n    rebound_parent = parent.model_copy(update={"manifest": changed_manifest})\n    second = build_certification_sample(rebound_parent, plan=plan)\n    assert first.manifest.sample_sha256 != second.manifest.sample_sha256\n\n\ndef test_certification_sample_rejects_parent_record_hash_mismatch() -> None:\n    records = _records()\n    revision = "git:" + "e" * 40\n    parent = build_pilot_sample(records, plan=FiveKPilotPlan(seed=1, quotas={"math": 4, "physics": 2, "statistics": 2, "mathoverflow": 2}), source_revisions={"stackmathqa": revision})\n    bad = parent.records[0].model_copy(update={"raw_sha256": "f" * 64})\n    tampered = parent.model_copy(update={"records": (bad, *parent.records[1:])})\n    with pytest.raises(ValueError, match="identity"):\n        build_certification_sample(tampered, plan=CertificationSamplePlan(seed=1, quotas={"math": 1}))\n\n\ndef test_certification_sample_fails_closed_on_insufficient_parent_stratum() -> None:\n    records = _records()\n    revision = "git:" + "f" * 40\n    parent = build_pilot_sample(records, plan=FiveKPilotPlan(seed=1, quotas={"math": 1}), source_revisions={"stackmathqa": revision})\n    with pytest.raises(ValueError, match="insufficient parent records"):\n        build_certification_sample(parent, plan=CertificationSamplePlan(seed=1, quotas={"math": 2}))\n'''
          test_pilot.write_text(text, encoding='utf-8', newline='\n')
          PY
          ruff format src/college_builder/pipeline/runner.py src/college_builder/pipeline/pilot.py tests/e2e/test_task15_calibration_holdout.py tests/unit/pipeline/test_pilot.py
      - name: Holdout contract GREEN
        run: pytest -q tests/e2e/test_task15_calibration_holdout.py
      - name: 100 child sampling GREEN
        run: pytest -q tests/unit/pipeline/test_pilot.py
      - name: Related regressions
        run: pytest -q tests/e2e/test_gold_regression.py tests/e2e/test_pipeline_resume.py tests/e2e/test_final_export.py tests/e2e/test_pilot_5k.py tests/e2e/test_pilot_sample_command.py
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
      - name: Commit and push feature
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '.github/workflows/task15-*')"
          git config user.name lingyi9909
          git config user.email zhanhui9909@gmail.com
          git add src/college_builder/pipeline/runner.py src/college_builder/pipeline/pilot.py tests/e2e/test_task15_calibration_holdout.py tests/unit/pipeline/test_pilot.py
          git commit -m "fix: enforce Task 15 holdout and child sample lineage"
          git push origin HEAD:feature/task15-pilot-freeze
          echo TASK15_AB_HEAD=$(git rev-parse HEAD)
