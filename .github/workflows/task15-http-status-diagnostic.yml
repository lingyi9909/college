name: Task 15 HTTP Status Diagnostic

on:
  push:
    branches:
      - ci/task15-http-status-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.TASK15_OPENAI_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.TASK15_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf49a9815f14f1b1b6619fa4c5e8018e133bd5b6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'

      - name: Verify configured secrets exist without exposing values
        shell: bash
        run: |
          test -n "$OPENAI_COMPATIBLE_BASE_URL"
          test -n "$OPENAI_COMPATIBLE_API_KEY"
          echo TASK15_PROVIDER_SECRETS_PRESENT=PASS

      - name: Select same four bounded real StackMathQA strata records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from college_builder.normalize.normalizer import normalize
          from college_builder.quality.answer import extract_source_answer
          from college_builder.source.stackmathqa import OFFICIAL_SOURCE_FILES, StackMathQAAdapter

          revision = 'git:13239ec8c8078bc8dfb43e1383069eb9be000ff7'
          base = ('https://huggingface.co/datasets/math-ai/StackMathQA/resolve/'
                  '13239ec8c8078bc8dfb43e1383069eb9be000ff7/'
                  'preprocessed/stackexchange-math--1q1a')
          selected = []
          for filename in OFFICIAL_SOURCE_FILES:
              adapter = StackMathQAAdapter()
              descriptor = tuple(adapter.discover({
                  'data_file': f'{base}/{filename}',
                  'revision': revision,
                  'license_metadata': {'declared': 'CC-BY-4.0', 'status': 'UPSTREAM_DECLARED'},
              }))[0]
              chosen = None
              for record in adapter.acquire(descriptor):
                  if record.metadata.get('language') != 'en':
                      continue
                  if len(record.raw_question) > 1600 or len(record.raw_analysis) > 3200:
                      continue
                  if extract_source_answer(normalize(record)).final_answer is None:
                      continue
                  chosen = record
                  break
              if chosen is None:
                  raise RuntimeError(f'no bounded answer-extractable record found for {filename}')
              selected.append(chosen)
          assert len(selected) == 4
          Path('/tmp/task15-micro.jsonl').write_text(
              ''.join(json.dumps(r.model_dump(mode='json'), ensure_ascii=False, sort_keys=True,
                                 separators=(',', ':')) + '\n' for r in selected),
              encoding='utf-8',
          )
          print('TASK15_MICRO_SAMPLE=PASS')
          PY

      - name: Run production pipeline with sanitized HTTP status instrumentation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx

          from college_builder.cli import _LocalJsonlAdapter, _runner
          from college_builder.config import PipelineConfig
          from college_builder.providers.openai_compatible import OpenAICompatibleStructuredModelProvider

          original = OpenAICompatibleStructuredModelProvider.classify
          events = []

          def instrumented(self, request):
              try:
                  return original(self, request)
              except httpx.HTTPStatusError as exc:
                  events.append({
                      'exception_type': type(exc).__name__,
                      'model': self.model,
                      'task': request.task,
                      'status_code': exc.response.status_code,
                  })
                  raise
              except Exception as exc:
                  events.append({
                      'exception_type': type(exc).__name__,
                      'model': self.model,
                      'task': request.task,
                  })
                  raise

          OpenAICompatibleStructuredModelProvider.classify = instrumented
          config = PipelineConfig.load(Path('config/pilot-5k-frozen.yaml'))
          workspace = Path('/tmp/task15-http-diagnostic-workspace')
          output = Path('/tmp/task15-http-diagnostic-output')
          result = _runner(config, workspace).run(
              adapter=_LocalJsonlAdapter(Path('/tmp/task15-micro.jsonl')),
              source_config={},
              output_dir=output,
          )
          report = json.loads(result.report_path.read_text(encoding='utf-8'))
          payload = {
              'events': events,
              'provider_errors': report['provider_errors'],
              'provider_call_counts': report['provider_call_counts'],
              'reject_reason_counts': report['reject_reason_counts'],
              'raw_count': report['raw_count'],
          }
          Path('/tmp/task15-http-status.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('TASK15_HTTP_STATUS=' + json.dumps(payload, sort_keys=True))
          PY

      - name: Assert diagnostic artifact has no raw content
        shell: bash
        run: |
          ! grep -Eq 'raw_question|raw_answer|raw_analysis|raw_payload|question:' /tmp/task15-http-status.json
          echo TASK15_DIAGNOSTIC_ARTIFACT_SAFETY=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: task15-http-status-diagnostic
          path: /tmp/task15-http-status.json
          if-no-files-found: error
          retention-days: 30
