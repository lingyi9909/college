name: Task 13 Acceptance Contract RED

on:
  push:
    branches:
      - verification/task13-review-contract-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 13 develop HEAD
        uses: actions/checkout@v4
        with:
          ref: 8e60eedc7374e748b899d772ed7b136662c63d0b
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Reproduce source-traceability and image-asset contract gaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from college_builder.domain.evidence import GateEvidence, GateVerdict
          from college_builder.domain.final_record import slim_question_md5_v1
          from college_builder.domain.question import (
              AnalysisContent, AnalysisType, AnswerContent, Classification,
              DedupState, Discipline, ProblemType, QualityState, QuestionContent,
              QuestionMetadata, QuestionProvenance, UniversityLevel, UniversityQuestionIR,
          )
          from college_builder.export.jsonl import ExportRecord, export_jsonl
          from college_builder.export.profile import to_final_record
          from college_builder.storage.state import RunStage

          def ir(*, raw_answer="x = 4", final_answer="x = 4", source_span="answer:0:5", question="Solve 2*x + 3 = 11.", assets=()):
              analysis = "Subtract 3 from both sides and divide by 2. Therefore x = 4"
              return UniversityQuestionIR(
                  candidate_id="candidate-1",
                  source_record_id="raw-1",
                  question=QuestionContent(raw=question, normalized=question, assets=assets),
                  answer=AnswerContent(raw=raw_answer, final_answer=final_answer, source_span=source_span),
                  analysis=AnalysisContent(raw=analysis, type=AnalysisType.DERIVATION),
                  classification=Classification(
                      discipline=Discipline.MATHEMATICS,
                      course="Linear Algebra",
                      level=UniversityLevel.UNDERGRADUATE,
                      problem_type=ProblemType.CALCULATION,
                  ),
                  metadata=QuestionMetadata(
                      knowledge_points=("linear equations",),
                      exam_points=("equation solving",),
                      language="en",
                  ),
                  quality=QualityState(gates=(GateEvidence(
                      gate_name="independent_correctness_verification",
                      verdict=GateVerdict.PASS,
                      score=0.999,
                      provider="review",
                      model="review-v1",
                      prompt_version="v1",
                      config_version="pilot-v1",
                  ),)),
                  provenance=QuestionProvenance(
                      source_dataset="stackmathqa",
                      source_id="42",
                      source_url="https://math.stackexchange.com/questions/42",
                      raw_sha256="a" * 64,
                  ),
                  dedup=DedupState(exact_hash=slim_question_md5_v1(question)),
              )

          failures = []

          # Task 13 acceptance says formal output must be source-traceable. A final answer
          # that does not equal its claimed source span must not reach JSONL.
          for bad in (
              ir(raw_answer="x = 4", final_answer="x = 5", source_span="answer:0:5"),
              ir(raw_answer="x = 4", final_answer="x = 4", source_span="answer:999:1000"),
              ir(raw_answer="x = 4", final_answer="x = 4", source_span="analysis:0:3"),
          ):
              try:
                  record = to_final_record(bad)
              except ValueError:
                  pass
              else:
                  failures.append(
                      f"untraceable final answer exported: answer={record.text_answer!r}, span={bad.answer.source_span!r}"
                  )

          # Design requires multimodal formal questions to have recoverable image placement
          # and landed files. An IR asset that is absent from final question markup and disk
          # must not silently produce is_pic_included=1 and a successful JSONL row.
          with TemporaryDirectory() as td:
              output = Path(td)
              bad_image = ir(
                  question="Use the missing diagram to solve the problem.",
                  assets=("image/missing.png",),
              )
              try:
                  path = export_jsonl(
                      [ExportRecord(ir=bad_image, stage=RunStage.ACCEPTED)],
                      output,
                  )
              except ValueError:
                  pass
              else:
                  failures.append(
                      f"missing/unplaced IR image asset exported successfully: {path}"
                  )

          if failures:
              print("TASK13_ACCEPTANCE_RED")
              for failure in failures:
                  print("-", failure)
              raise SystemExit(1)

          print("TASK13_ACCEPTANCE_GREEN")
          PY
