name: Task16C4 License Provenance

on:
  push:
    branches: [feature/task16c4-license-provenance]

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task16C4 focused regression
        run: >-
          pytest -q
          tests/unit/export/test_task16c4_license_provenance.py
          tests/unit/export/test_jsonl.py
          tests/e2e/test_final_export.py
          tests/e2e/test_gold_regression.py
      - name: Fresh full pytest
        run: pytest -q
      - name: Fresh Ruff
        run: ruff check src tests
      - name: Fresh MyPy
        run: mypy src
