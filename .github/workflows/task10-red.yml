name: Task 10 RED
on:
  push:
    branches:
      - verification/task10-red
jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 10 RED exact test head
        uses: actions/checkout@v4
        with:
          ref: 43f164a037dee1e337c93edb8b2b1888ef0a6e2b
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Run Task 10 RED tests
        run: pytest tests/unit/quality/test_answer.py tests/unit/quality/test_analysis.py -q
