name: Task 4 Develop Exact HEAD Gate

on:
  push:
    branches:
      - verification/task4-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop exact Task 4 HEAD
        uses: actions/checkout@v4
        with:
          ref: cdc29240e3b46b42af11dc89a274efaf27e44447
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 4 pytest
        run: pytest tests/unit/source/test_base.py tests/unit/source/test_huggingface.py -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
