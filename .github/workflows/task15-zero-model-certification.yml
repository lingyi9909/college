name: Task 15 Zero-Model Sampling Certification

on:
  push:
    branches: [ci/task15-zero-model-certification]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: d3b35964ac92d799405fd88101fa11fd05ff1460
          path: work
      - name: Assert exact Task 15 code SHA and no model environment
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d3b35964ac92d799405fd88101fa11fd05ff1460"
          test -z "${OPENAI_COMPATIBLE_BASE_URL:-}"
          test -z "${OPENAI_COMPATIBLE_API_KEY:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: work
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic 5K + 100-child certification
        working-directory: work
        run: python ../ci-source/ci/task15_zero_model_cert.py
      - name: Validate safe manifests and summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/task15-zero-model-summary.json').read_text())
          assert summary['model_calls'] == 0
          assert summary['deterministic_reproduction'] is True
          assert summary['five_k_strata'] == {'math': 2000, 'physics': 1000, 'statistics': 1000, 'mathoverflow': 1000}
          assert summary['hundred_strata'] == {'math': 40, 'physics': 20, 'statistics': 20, 'mathoverflow': 20}
          assert summary['five_k_sample_sha256'] == 'e9d7b957a092114da35dbb839319a08ab555692a8a06863faf2b1980c2a681c5'
          print('TASK15_ZERO_MODEL_MANIFESTS=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task15-zero-model-certification
          path: |
            /tmp/task15-5k-manifest.json
            /tmp/task15-100-manifest.json
            /tmp/task15-zero-model-summary.json
            /tmp/task15-100-sample.jsonl
          if-no-files-found: error
          retention-days: 30
