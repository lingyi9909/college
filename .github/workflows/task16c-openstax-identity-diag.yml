name: Task16C OpenStax Identity Diagnostic

on:
  push:
    branches: [ci/task16c-openstax-diag]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose immutable OpenStax snapshot identities
        run: python ci/task16c_openstax_identity_diag.py
