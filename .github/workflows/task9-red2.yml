name: Task 9 RED 2

on:
  push:
    branches:
      - verification/task9-red2

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Task 9 test-only HEAD
        uses: actions/checkout@v4
        with:
          ref: a99f1fb991f864fdbaf416cb62195e5f3d734c44
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 9 RED tests
        run: pytest tests/unit/providers tests/unit/quality/test_classify.py -q
