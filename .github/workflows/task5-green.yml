name: Task 5 Develop Exact HEAD Gate

on:
  push:
    branches:
      - verification/task5-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop exact Task 5 HEAD
        uses: actions/checkout@v4
        with:
          ref: 0bf7b2b44a956e8c37a16b49cf1bdd720516c1b7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 5 pytest
        run: pytest tests/unit/source/test_stackmathqa.py -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
