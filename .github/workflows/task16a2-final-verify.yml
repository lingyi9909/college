name: Task16A2 Final Verify

on:
  push:
    branches:
      - ci/task16a2-final-verify
    paths:
      - .github/workflows/task16a2-final-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 773051a5799c835d994cfc939fda8352f0d9f6b8
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "773051a5799c835d994cfc939fda8352f0d9f6b8"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task15 real Gate3 evidence regressions
        run: pytest tests/unit/quality/test_task16_task15_answer_evidence.py -q
      - name: Task16A2 existing regressions
        run: pytest tests/unit/quality/test_task16_answer_recall.py tests/unit/quality/test_answer.py tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
