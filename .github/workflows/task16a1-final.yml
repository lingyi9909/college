name: Task16A1 Final Verification

on:
  push:
    branches:
      - verification/task16a1-final

permissions:
  contents: read

jobs:
  verify-task16a1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91eed9419f979c76e11751e2dbba7a54290bb21e
      - name: Exact candidate guard
        run: test "$(git rev-parse HEAD)" = "91eed9419f979c76e11751e2dbba7a54290bb21e"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A1 focused tests
        run: pytest tests/unit/quality/test_task16_gate2_conflict.py -q
      - name: Existing classification and Gold regression
        run: pytest tests/unit/quality/test_classify.py tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
