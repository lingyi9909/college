name: Task16A1 Final Verification

on:
  push:
    branches:
      - verification/task16a1-final

permissions:
  contents: read

jobs:
  verify-task16a1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8e39efe9ec97183da7cd11e37cbec1d059f50cc
      - name: Exact candidate guard
        run: test "$(git rev-parse HEAD)" = "e8e39efe9ec97183da7cd11e37cbec1d059f50cc"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A1 focused tests
        run: pytest tests/unit/quality/test_task16_gate2_conflict.py -q
      - name: Existing classification and Gold regression
        run: pytest tests/unit/quality/test_classify.py tests/e2e/test_gold_regression.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
