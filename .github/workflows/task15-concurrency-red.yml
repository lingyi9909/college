name: Task 15 Pipeline Concurrency RED

on:
  push:
    branches:
      - ci/task15-concurrency-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f88ca16d85c69054d1508218e86532dda06141fa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/e2e/test_task15_pipeline_concurrency.py
