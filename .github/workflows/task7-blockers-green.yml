name: Task 7 Develop Exact HEAD Blocker Gate

on:
  push:
    branches:
      - verification/task7-blockers-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop exact Task 7 HEAD
        uses: actions/checkout@v4
        with:
          ref: 6738b3db951ba5c8b35a8a9e2670223d0f4ea254
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 7 tests
        run: pytest tests/unit/normalize tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
