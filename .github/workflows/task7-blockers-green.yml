name: Task 7 Blockers Candidate Gate

on:
  push:
    branches:
      - verification/task7-blockers-green

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 7 blocker-fix candidate
        uses: actions/checkout@v4
        with:
          ref: b7a4313bcc76d99c487ecba703dcc7110c6eec2f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 7 tests
        run: pytest tests/unit/normalize tests/golden -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
