name: Task16A3 RED

on:
  push:
    branches:
      - ci/task16a3-red
    paths:
      - .github/workflows/task16a3-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05768705f64c115772c039fa4dfdec555364f073
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "05768705f64c115772c039fa4dfdec555364f073"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A3 focused RED
        run: pytest tests/unit/quality/test_analysis.py tests/e2e/test_task15_provider_prompt_protocol.py -q
