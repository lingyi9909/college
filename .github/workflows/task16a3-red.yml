name: Task16A3 RED

on:
  push:
    branches:
      - ci/task16a3-red
    paths:
      - .github/workflows/task16a3-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63ba59555677ff24079685ee9ef423ca819f61c3
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "63ba59555677ff24079685ee9ef423ca819f61c3"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Task16A3 relevance RED
        run: pytest tests/unit/quality/test_task16a3_analysis_evidence_relevance.py -q
