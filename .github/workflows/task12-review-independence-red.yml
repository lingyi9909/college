name: Task 12 Independence RED

on:
  push:
    branches:
      - verification/task12-review-independence-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 12 develop HEAD
        uses: actions/checkout@v4
        with:
          ref: 74176b2f8daeed99ce1a0362e9264a2f5e8589d8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Prove same provider+model can satisfy both alignment and independent correctness
        shell: bash
        run: |
          python - <<'PY'
          from college_builder.domain.evidence import GateVerdict
          from college_builder.domain.source import NormalizedQA
          from college_builder.providers.base import ModelDecision
          from college_builder.providers.fake import FakeStructuredModelProvider
          from college_builder.quality.engine import GateContext, GateEngine
          from college_builder.quality.verify import AlignmentGate, CorrectnessVerifier

          candidate = NormalizedQA(
              record_id="norm-1",
              source_record_id="raw-1",
              question="Explain why the harmonic series diverges.",
              answer="It diverges.",
              analysis="Group terms in dyadic blocks; each block contributes at least one half.",
              subject_candidates=("mathematics",),
              images=(),
              metadata={},
              normalization_evidence={},
          )
          refs = (
              f"question:0-{len(candidate.question)}",
              f"answer:0-{len(candidate.answer)}",
              f"analysis:0-{len(candidate.analysis)}",
          )
          same_execution_identity = FakeStructuredModelProvider(
              provider="same-provider",
              model="same-model",
              decisions=(
                  ModelDecision(label="PASS", score=0.999, evidence_references=refs, reason_code="ALIGN"),
                  ModelDecision(label="PASS", score=0.999, evidence_references=refs, reason_code="CORRECT"),
              ),
          )
          alignment = AlignmentGate(
              provider=same_execution_identity,
              prompt="alignment",
              prompt_version="v1",
          )
          correctness = CorrectnessVerifier(
              provider=same_execution_identity,
              prompt="correctness",
              prompt_version="v1",
              calibration_id="identity-v1",
          )
          result = GateEngine(
              gates=(alignment, correctness),
              context=GateContext(config_version="pilot-v1"),
          ).run(candidate)

          if result.verdict is GateVerdict.PASS:
              print("TASK12_INDEPENDENCE_RED")
              print("- alignment and independent correctness both PASS with identical provider+model identity")
              print("- identities:", [(e.gate_name, e.provider, e.model) for e in result.evidence])
              raise SystemExit(1)

          print("TASK12_INDEPENDENCE_GREEN", result.verdict, [e.reason_code for e in result.evidence])
          PY
