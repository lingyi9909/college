name: Task 10 Numeric Answer Regression

on:
  push:
    branches:
      - verification/task10-review-numeric-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 10 develop HEAD
        uses: actions/checkout@v4
        with:
          ref: d1f76561e9cc6292dc4e791e5be3efe7830fc209
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Diagnose numeric source answers
        run: |
          python - <<'PY'
          from college_builder.domain.source import NormalizedQA
          from college_builder.quality.answer import _is_unextractable_direct_answer, extract_source_answer

          for answer in ("4", "42", "2026"):
              item = NormalizedQA(
                  record_id="norm-num",
                  source_record_id="raw-num",
                  question="Compute the requested value.",
                  answer=answer,
                  analysis="The source solution derives the value by the stated steps.",
                  subject_candidates=("mathematics",),
                  images=(),
                  metadata={},
                  normalization_evidence={},
              )
              print(answer, _is_unextractable_direct_answer(answer), extract_source_answer(item).model_dump())
          PY
