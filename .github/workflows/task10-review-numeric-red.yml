name: Task 10 Numeric Answer Regression

on:
  push:
    branches:
      - verification/task10-review-numeric-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 10 develop HEAD
        uses: actions/checkout@v4
        with:
          ref: d1f76561e9cc6292dc4e791e5be3efe7830fc209
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Numeric source answers must remain extractable
        run: |
          python - <<'PY'
          from college_builder.domain.evidence import GateVerdict
          from college_builder.domain.source import NormalizedQA
          from college_builder.quality.answer import AnswerGate
          from college_builder.quality.engine import GateContext, GateEngine

          failures = []
          for answer in ("4", "42", "2026"):
              item = NormalizedQA(
                  record_id="norm-num",
                  source_record_id="raw-num",
                  question="Compute the requested value.",
                  answer=answer,
                  analysis="The source solution derives the value by the stated steps.",
                  subject_candidates=("mathematics",),
                  images=(),
                  metadata={},
                  normalization_evidence={},
              )
              evidence = GateEngine(
                  gates=(AnswerGate(),),
                  context=GateContext(config_version="pilot-v1"),
              ).run(item).evidence[0]
              if evidence.verdict is not GateVerdict.PASS:
                  failures.append(f"literal numeric source answer {answer!r} rejected: {evidence.reason_code}")
          if failures:
              print("TASK10_NUMERIC_RED")
              for failure in failures:
                  print("-", failure)
              raise SystemExit(1)
          print("TASK10_NUMERIC_GREEN")
          PY
