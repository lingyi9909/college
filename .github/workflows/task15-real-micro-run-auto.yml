name: Task 15 Real Four-Strata Auto-Model Micro Run

on:
  push:
    branches:
      - ci/task15-real-micro-run-auto

permissions:
  contents: read
  copilot-requests: write

jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba7056219064c529ea0d7eabd898a901fffdc6e4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: npm install -g @github/copilot

      - name: Select four short real answer-extractable source records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from college_builder.normalize.normalizer import normalize
          from college_builder.quality.answer import extract_source_answer
          from college_builder.source.stackmathqa import OFFICIAL_SOURCE_FILES, StackMathQAAdapter

          revision = 'git:13239ec8c8078bc8dfb43e1383069eb9be000ff7'
          base = ('https://huggingface.co/datasets/math-ai/StackMathQA/resolve/'
                  '13239ec8c8078bc8dfb43e1383069eb9be000ff7/'
                  'preprocessed/stackexchange-math--1q1a')
          selected = []
          for filename in OFFICIAL_SOURCE_FILES:
              adapter = StackMathQAAdapter()
              descriptor = tuple(adapter.discover({
                  'data_file': f'{base}/{filename}',
                  'revision': revision,
                  'license_metadata': {'declared': 'CC-BY-4.0', 'status': 'UPSTREAM_DECLARED'},
              }))[0]
              chosen = None
              for record in adapter.acquire(descriptor):
                  if record.metadata.get('language') != 'en':
                      continue
                  if len(record.raw_question) > 1600 or len(record.raw_analysis) > 3200:
                      continue
                  if extract_source_answer(normalize(record)).final_answer is None:
                      continue
                  chosen = record
                  break
              if chosen is None:
                  raise RuntimeError(f'no bounded answer-extractable record found for {filename}')
              selected.append(chosen)
              print(f"MICRO_SOURCE site={chosen.metadata['source_site']} id={chosen.record_id}")
          Path('/tmp/task15-micro.jsonl').write_text(
              ''.join(json.dumps(r.model_dump(mode='json'), ensure_ascii=False, sort_keys=True,
                                 separators=(',', ':')) + '\n' for r in selected),
              encoding='utf-8',
          )
          assert len(selected) == 4
          PY

      - name: Create temporary transparent auto-model config
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          payload = yaml.safe_load(Path('config/pilot-5k-frozen.yaml').read_text())
          payload['config_version'] = 'pilot-5k-copilot-auto-micro-v1'
          alias = 'github-copilot-auto-ci-proxy-v1'
          payload['providers']['classifier']['model'] = alias
          payload['providers']['verifier']['model'] = alias
          Path('/tmp/task15-micro.yaml').write_text(
              yaml.safe_dump(payload, allow_unicode=True, sort_keys=False), encoding='utf-8')
          print('MICRO_MODEL_SELECTOR=github-copilot-auto')
          PY

      - name: Start CI-only OpenAI-compatible proxy backed by Copilot auto
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/copilot_proxy.py <<'PY'
          import json
          import subprocess
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          METRICS = Path('/tmp/copilot-proxy-metrics.jsonl')

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return
              def do_POST(self):
                  if self.path != '/chat/completions':
                      self.send_error(404); return
                  body = json.loads(self.rfile.read(int(self.headers.get('Content-Length', '0'))))
                  messages = body.get('messages', [])
                  system = next((str(x.get('content','')) for x in messages if x.get('role') == 'system'), '')
                  user = next((str(x.get('content','')) for x in messages if x.get('role') == 'user'), '')
                  prompt = ('Act only as a deterministic classification endpoint. Do not use tools. '
                            'Follow the SYSTEM contract exactly. Return ONLY the requested JSON object, '
                            'with no markdown fences or commentary.\n\nSYSTEM:\n' + system + '\n\nUSER:\n' + user)
                  started = time.perf_counter()
                  proc = subprocess.run(
                      ['copilot', '-p', prompt, '-s', '--no-ask-user'],
                      text=True, capture_output=True, timeout=180, check=False)
                  elapsed = time.perf_counter() - started
                  with METRICS.open('a', encoding='utf-8') as f:
                      f.write(json.dumps({
                          'elapsed_seconds': round(elapsed, 3),
                          'returncode': proc.returncode,
                          'stdout_chars': len(proc.stdout),
                          'stderr_chars': len(proc.stderr),
                          'model_selector': 'auto',
                          'requested_alias': body.get('model'),
                      }, sort_keys=True) + '\n')
                  if proc.returncode != 0:
                      raw = json.dumps({'error': {'message': 'Copilot CLI request failed'}}).encode()
                      self.send_response(502)
                  else:
                      raw = json.dumps({'choices':[{'message':{'content':proc.stdout.strip()}}]}).encode()
                      self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(raw)))
                  self.end_headers(); self.wfile.write(raw)

          ThreadingHTTPServer(('127.0.0.1', 8765), Handler).serve_forever()
          PY
          python /tmp/copilot_proxy.py >/tmp/copilot-proxy.log 2>&1 &
          sleep 1
          echo COPILOT_AUTO_PROXY_STARTED=PASS

      - name: Execute production CLI micro run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:8765
        run: |
          college-builder run \
            --input /tmp/task15-micro.jsonl \
            --config /tmp/task15-micro.yaml \
            --workspace /tmp/task15-micro-workspace \
            --output /tmp/task15-micro-output

      - name: Summarize model contract, calls, funnel and latency
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run_dirs = list((Path('/tmp/task15-micro-workspace') / 'runs').iterdir())
          assert len(run_dirs) == 1
          report = json.loads((run_dirs[0] / 'run_report.json').read_text())
          metrics = [json.loads(x) for x in Path('/tmp/copilot-proxy-metrics.jsonl').read_text().splitlines() if x]
          summary = {
              'raw_count': report['raw_count'],
              'accepted_count': report['accepted_count'],
              'rejected_count': report['rejected_count'],
              'reject_reason_counts': report['reject_reason_counts'],
              'funnel': report['funnel'],
              'provider_call_counts': report['provider_call_counts'],
              'pipeline_provider_errors': report['provider_errors'],
              'fallback_count': report['fallback_count'],
              'proxy_model_calls': len(metrics),
              'proxy_nonzero_calls': sum(x['returncode'] != 0 for x in metrics),
              'proxy_total_seconds': round(sum(x['elapsed_seconds'] for x in metrics), 3),
              'proxy_mean_seconds': round(sum(x['elapsed_seconds'] for x in metrics) / len(metrics), 3) if metrics else 0,
              'model_selector': 'github-copilot-auto',
              'model_alias': 'github-copilot-auto-ci-proxy-v1',
          }
          assert summary['raw_count'] == 4
          assert metrics
          Path('/tmp/task15-micro-summary.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          print('MICRO_RUN_SUMMARY=' + json.dumps(summary, sort_keys=True))
          print('MICRO_PIPELINE_EXIT=PASS')
          PY

      - name: Retain only non-content evidence
        shell: bash
        run: |
          cp "$(find /tmp/task15-micro-workspace/runs -name run_report.json -print -quit)" /tmp/task15-micro-run-report.json
          ! grep -Eq 'raw_question|raw_answer|raw_analysis|raw_payload' /tmp/task15-micro-summary.json
          echo MICRO_ARTIFACT_SAFETY=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: task15-real-auto-model-micro-run-evidence
          path: |
            /tmp/task15-micro-summary.json
            /tmp/task15-micro-run-report.json
          if-no-files-found: error
          retention-days: 30
