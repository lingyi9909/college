name: Task 14 Final Reviewer Exact HEAD V5

on:
  push:
    branches:
      - verification/task14-final-review-exact-head-v5

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repaired Task 14 HEAD
        uses: actions/checkout@v4
        with:
          ref: c7a57d9142156232444d2e7f8fc83031d09d039e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: git rev-parse HEAD
      - name: Independent immutable-revision contracts
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from college_builder.pipeline.runner import _has_trusted_source_revision
          from college_builder.source.base import SourceDescriptor

          failures = []

          def descriptor(revision):
              return SourceDescriptor(
                  source_type="dataset",
                  source_dataset="fixture",
                  source_url="https://example.test/fixture",
                  locator="fixture.jsonl",
                  shard="fixture.jsonl",
                  source_revision=revision,
              )

          for revision in (None, "main", "master", "latest", "dev", "release-v1", "feature/x", "v1.2.3", "a" * 40):
              if _has_trusted_source_revision(descriptor(revision)):
                  failures.append(f"mutable/unproven revision trusted: {revision!r}")

          immutable = (
              "sha256:" + "a" * 64,
              "git:" + "b" * 40,
              "git:" + "c" * 64,
          )
          for revision in immutable:
              if not _has_trusted_source_revision(descriptor(revision)):
                  failures.append(f"explicit immutable revision rejected: {revision!r}")

          spec = importlib.util.spec_from_file_location("task14_fixture", "tests/e2e/test_pipeline_resume.py")
          fixture = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(fixture)

          # Mutable symbolic ref: changed content must be reacquired and create a new run.
          with TemporaryDirectory() as td:
              root = Path(td)
              workspace = root / "workspace"
              config = fixture._config()
              a1 = fixture.CountingAdapter((fixture._record(1, "VALID", question_override="MAIN-Q1: Calculate 1 + 1"),), revision="main")
              r1 = fixture._runner(config=config, workspace=workspace).run(adapter=a1, source_config={}, output_dir=root / "out1")
              a2 = fixture.CountingAdapter((fixture._record(1, "VALID", question_override="MAIN-Q2: Calculate 2 + 2"),), revision="main")
              r2 = fixture._runner(config=config, workspace=workspace).run(adapter=a2, source_config={}, output_dir=root / "out2")
              out2 = (root / "out2" / "questions.jsonl").read_text(encoding="utf-8")
              if a2.acquire_calls != 1 or r1.run_id == r2.run_id or "MAIN-Q2" not in out2 or "MAIN-Q1" in out2:
                  failures.append("mutable symbolic revision still reused stale source snapshot")

          # Explicit immutable authority: same revision may reuse source acquisition cache.
          with TemporaryDirectory() as td:
              root = Path(td)
              workspace = root / "workspace"
              config = fixture._config()
              revision = "sha256:" + "d" * 64
              records = (fixture._record(1, "VALID"),)
              a1 = fixture.CountingAdapter(records, revision=revision)
              r1 = fixture._runner(config=config, workspace=workspace).run(adapter=a1, source_config={}, output_dir=root / "out1")
              a2 = fixture.CountingAdapter(records, revision=revision)
              r2 = fixture._runner(config=config, workspace=workspace).run(adapter=a2, source_config={}, output_dir=root / "out2")
              if a1.acquire_calls != 1 or a2.acquire_calls != 0 or r1.run_id != r2.run_id:
                  failures.append("explicit immutable revision did not reuse deterministic acquisition snapshot")

          # Re-check prior blockers: complete per-source/per-subject funnel and durable reject evidence.
          from college_builder.reporting.pilot_report import ProviderUsage, RecordAudit, build_pilot_report
          audits = (
              RecordAudit(record_id="1", source_dataset="a", subject="MATHEMATICS", normalized=True, stem=True, university=True, university_stem=True, problem=True, answer_valid=True, analysis_valid=True, alignment_pass=True, after_dedup=True, accepted=True),
              RecordAudit(record_id="2", source_dataset="a", subject="MATHEMATICS", normalized=True, stem=True, university=False, reject_reason="NOT_UNIVERSITY_LEVEL"),
              RecordAudit(record_id="3", source_dataset="a", subject="PHYSICS", normalized=True, stem=True, university=True, university_stem=True, problem=False, reject_reason="NOT_PROBLEM"),
          )
          report = build_pilot_report(run_id="run-contract", audits=audits, provider_usage=ProviderUsage(), wall_time_seconds=0.0)
          required = {"raw", "normalized", "stem", "university", "problem", "answer_valid", "analysis_valid", "alignment_pass", "after_dedup", "final_accepted"}
          for dist in (report.source_distribution, report.subject_distribution):
              for bucket in dist.values():
                  if not required <= set(bucket.model_dump(mode="json")):
                      failures.append("distribution bucket lost complete funnel")

          with TemporaryDirectory() as td:
              root = Path(td)
              workspace = root / "workspace"
              config = fixture._config()
              corrupt = fixture._record(4, "VALID").model_copy(update={"raw_sha256": "f" * 64})
              result = fixture._runner(config=config, workspace=workspace).run(adapter=fixture.CountingAdapter((corrupt,), revision="corrupt-v1"), source_config={}, output_dir=root / "out")
              paths = list((result.run_dir / "rejected").glob("*.json"))
              if len(paths) != 1:
                  failures.append("durable rejection artifact missing")
              else:
                  rejection = json.loads(paths[0].read_text(encoding="utf-8"))
                  if rejection.get("stage") != "integrity" or rejection.get("reason_code") != "SOURCE_CORRUPTED" or not rejection.get("evidence"):
                      failures.append("durable rejection evidence/identity incorrect")

          if failures:
              print("TASK14_FINAL_ACCEPTANCE_RED")
              for failure in failures:
                  print("-", failure)
              raise SystemExit(1)
          print("TASK14_FINAL_ACCEPTANCE_GREEN")
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repaired Task 14 HEAD
        uses: actions/checkout@v4
        with:
          ref: c7a57d9142156232444d2e7f8fc83031d09d039e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: git rev-parse HEAD
      - name: Task 14 targeted
        run: pytest tests/e2e/test_pipeline_report.py tests/e2e/test_pipeline_resume.py -q
      - name: Full pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
