name: Task 15 Final Exact-Head Certification

on:
  push:
    branches:
      - ci/task15-precert-current-head

permissions:
  contents: read

jobs:
  final-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5572fe691a866d048309806a8db051244a2d46d3
          fetch-depth: 0

      - name: Exact-head and certified-code lineage guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5572fe691a866d048309806a8db051244a2d46d3"
          python - <<'PY'
          import subprocess

          certified = 'd3b35964ac92d799405fd88101fa11fd05ff1460'
          expected = {
              'artifacts/100/run_report.json',
              'artifacts/100/sample_manifest.json',
              'artifacts/5k/sampling_certification.json',
              'docs/validation/100-dry-run-audit.md',
              'docs/validation/task15-downstream-micro-evidence.md',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{certified}..HEAD'],
                  text=True,
              ).splitlines()
          )
          assert changed == expected, (changed, expected)
          print('TASK15_CERTIFIED_CODE_LINEAGE=PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen identities and formal evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml

          config_path = Path('config/pilot-5k-frozen.yaml')
          config_sha = hashlib.sha256(config_path.read_bytes()).hexdigest()
          assert config_sha == '24749a95a1faf84f909911f4f4fc0c59ee5b514c63b4f440efa64b2ea165fcf3', config_sha
          config = yaml.safe_load(config_path.read_text(encoding='utf-8'))
          assert config['thresholds'] == {
              'university': 0.98,
              'problem': 0.98,
              'answer_extract': 0.995,
              'analysis': 0.98,
              'qa_alignment': 0.995,
          }
          assert config['providers']['classifier'] == {
              'provider': 'openai_compatible',
              'model': 'deepseek-flash',
          }
          assert config['providers']['verifier'] == {
              'provider': 'openai_compatible',
              'model': 'deepseek-v4-pro',
          }

          report = json.loads(Path('artifacts/100/run_report.json').read_text(encoding='utf-8'))
          assert report['exact_code_sha'] == 'd3b35964ac92d799405fd88101fa11fd05ff1460'
          assert report['five_k_sample_sha256'] == 'e9d7b957a092114da35dbb839319a08ab555692a8a06863faf2b1980c2a681c5'
          assert report['hundred_sample_sha256'] == 'ae513933791c2ac27d3916a4149193c2477e00ce993c59b597b27ad02101ae8e'
          assert report['raw_count'] == 100
          assert report['accepted_count'] == 0
          assert report['rejected_count'] == 100
          assert report['tokens'] is None and report['tokens_available'] is False
          assert report['estimated_cost_usd'] is None and report['estimated_cost_usd_available'] is False

          sample = json.loads(Path('artifacts/100/sample_manifest.json').read_text(encoding='utf-8'))
          assert sample['parent_sample_sha256'] == 'e9d7b957a092114da35dbb839319a08ab555692a8a06863faf2b1980c2a681c5'
          assert sample['sample_sha256'] == 'ae513933791c2ac27d3916a4149193c2477e00ce993c59b597b27ad02101ae8e'
          assert sample['total'] == 100

          five_k = json.loads(Path('artifacts/5k/sampling_certification.json').read_text(encoding='utf-8'))
          assert five_k['sample_sha256'] == 'e9d7b957a092114da35dbb839319a08ab555692a8a06863faf2b1980c2a681c5'
          assert five_k['total'] == 5000
          print('TASK15_FROZEN_IDENTITY_AND_EVIDENCE=PASS')
          PY

      - name: User-specified focused Task 15 suite
        run: >-
          pytest
          tests/e2e/test_pilot_5k.py
          tests/e2e/test_pilot_sample_command.py
          tests/e2e/test_gold_regression.py
          tests/e2e/test_task15_pipeline_concurrency.py
          tests/e2e/test_task15_provider_prompt_protocol.py
          tests/unit/pipeline/test_pilot.py
          tests/unit/providers/test_openai_compatible_resilience.py
          tests/unit/test_provider_config_resilience.py
          -q

      - name: Full pytest
        run: pytest -q

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy src

      - name: Scope and raw-data guards
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -Eq '^artifacts/5k/(sample\.jsonl|output/|workspace/)'
          ! git ls-files | grep -Eq '^\.github/workflows/task15-(formal-5k|deepseek|cancel|post5k|monitor|precert)'
          git diff --exit-code
          echo TASK15_FINAL_SCOPE_AND_RAW_GUARDS=PASS
