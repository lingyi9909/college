name: Task 13 Review Exact HEAD Gate

on:
  push:
    branches:
      - verification/task13-review-exact-head

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 13 review exact develop HEAD
        uses: actions/checkout@v4
        with:
          ref: b9aac953c1574563a4dfbc53ee4e41e6726b2329
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Show exact HEAD
        run: git rev-parse HEAD
      - name: Task 13 targeted tests
        run: pytest tests/unit/export tests/e2e/test_final_export.py -q
      - name: Full test suite
        run: pytest tests -q
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
