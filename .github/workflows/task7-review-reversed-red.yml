name: Task 7 Review Semantic Loss Regressions

on:
  push:
    branches:
      - verification/task7-review-reversed-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop exact Task 7 HEAD
        uses: actions/checkout@v4
        with:
          ref: 6738b3db951ba5c8b35a8a9e2670223d0f4ea254
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Reproduce semantic-loss boundaries
        shell: bash
        run: |
          python - <<'PY'
          from college_builder.normalize.html import normalize_html

          failures = []

          reversed_source = '<ol reversed><li>Option A</li><li>Option B</li></ol>'
          reversed_result = normalize_html(reversed_source)
          reversed_preserved = reversed_result.text == '2. Option A\n1. Option B'
          reversed_closed = '<ol' in reversed_result.text and bool(reversed_result.unresolved_structure)
          print('reversed.normalized=', repr(reversed_result.text))
          print('reversed.unresolved=', reversed_result.unresolved_structure)
          if not (reversed_preserved or reversed_closed):
              failures.append(
                  'reversed ordered-list semantics silently rewritten: '
                  f'{reversed_result.text!r}'
              )

          link_source = '<p>Refer to <link target-id="fig-7"/> before answering.</p>'
          link_result = normalize_html(link_source)
          link_preserved = 'fig-7' in link_result.text
          link_closed = bool(link_result.unresolved_structure)
          print('target_link.normalized=', repr(link_result.text))
          print('target_link.unresolved=', link_result.unresolved_structure)
          if not (link_preserved or link_closed):
              failures.append(
                  'target-id link silently deleted: '
                  f'{link_result.text!r}'
              )

          assert not failures, '\n'.join(failures)
          PY