name: Task 15 Analysis JSON Prompt RED

on:
  push:
    branches:
      - ci/task15-analysis-json-prompt-tdd

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/e2e/test_task15_provider_prompt_protocol.py
