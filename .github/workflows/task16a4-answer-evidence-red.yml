name: Task16A4 Answer Evidence RED

on:
  push:
    branches:
      - ci/task16a4-answer-evidence-red

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fff2b92a67346385b95664690f060c873c73e2ee
          fetch-depth: 1
      - name: Exact HEAD guard
        run: test "$(git rev-parse HEAD)" = "fff2b92a67346385b95664690f060c873c73e2ee"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Task16A4 answer-evidence RED
        run: pytest tests/unit/quality/test_task16a4_downstream_span_protocol.py -q
