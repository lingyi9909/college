name: Task 15 DeepSeek 20-Record Expansion

on:
  push:
    branches:
      - ci/task15-deepseek-20

permissions:
  contents: read

jobs:
  run20:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.TASK15_OPENAI_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.TASK15_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d1c047563d34d3de9bed01200256a50d84fb435
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'

      - name: Build bounded 20-record four-strata engineering sample
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from college_builder.normalize.normalizer import normalize
          from college_builder.quality.answer import extract_source_answer
          from college_builder.source.stackmathqa import OFFICIAL_SOURCE_FILES, StackMathQAAdapter

          quotas = {'math': 8, 'physics': 4, 'statistics': 4, 'mathoverflow': 4}
          revision = 'git:13239ec8c8078bc8dfb43e1383069eb9be000ff7'
          base = ('https://huggingface.co/datasets/math-ai/StackMathQA/resolve/'
                  '13239ec8c8078bc8dfb43e1383069eb9be000ff7/'
                  'preprocessed/stackexchange-math--1q1a')
          selected = []
          counts = {key: 0 for key in quotas}
          for filename, (stratum, _host) in OFFICIAL_SOURCE_FILES.items():
              quota = quotas[stratum]
              adapter = StackMathQAAdapter()
              descriptor = tuple(adapter.discover({
                  'data_file': f'{base}/{filename}',
                  'revision': revision,
                  'license_metadata': {'declared': 'CC-BY-4.0', 'status': 'UPSTREAM_DECLARED'},
              }))[0]
              for record in adapter.acquire(descriptor):
                  if counts[stratum] >= quota:
                      break
                  if record.metadata.get('language') != 'en':
                      continue
                  if len(record.raw_question) > 1600 or len(record.raw_analysis) > 3200:
                      continue
                  if extract_source_answer(normalize(record)).final_answer is None:
                      continue
                  selected.append(record)
                  counts[stratum] += 1
          assert counts == quotas, (counts, quotas)
          assert len(selected) == 20
          Path('/tmp/task15-20.jsonl').write_text(
              ''.join(json.dumps(r.model_dump(mode='json'), ensure_ascii=False, sort_keys=True,
                                 separators=(',', ':')) + '\n' for r in selected),
              encoding='utf-8',
          )
          Path('/tmp/task15-20-sample-meta.json').write_text(
              json.dumps({'quotas': quotas, 'counts': counts, 'total': len(selected)}, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('TASK15_20_SAMPLE=' + json.dumps(counts, sort_keys=True))
          PY

      - name: Execute production pipeline on 20 real records
        shell: bash
        run: |
          college-builder run \
            --input /tmp/task15-20.jsonl \
            --config config/pilot-5k-frozen.yaml \
            --workspace /tmp/task15-20-workspace \
            --output /tmp/task15-20-output

      - name: Summarize non-content 20-record evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run_dirs = list((Path('/tmp/task15-20-workspace') / 'runs').iterdir())
          assert len(run_dirs) == 1
          report = json.loads((run_dirs[0] / 'run_report.json').read_text(encoding='utf-8'))
          summary = {
              'feature_sha': '3d1c047563d34d3de9bed01200256a50d84fb435',
              'sample': {'math': 8, 'physics': 4, 'statistics': 4, 'mathoverflow': 4},
              'raw_count': report['raw_count'],
              'accepted_count': report['accepted_count'],
              'rejected_count': report['rejected_count'],
              'acceptance_rate': report['acceptance_rate'],
              'funnel': report['funnel'],
              'reject_reason_counts': report['reject_reason_counts'],
              'provider_call_counts': report['provider_call_counts'],
              'provider_errors': report['provider_errors'],
              'provider_latency_seconds': report['provider_latency_seconds'],
              'wall_time_seconds': report['wall_time_seconds'],
              'classifier_model': 'deepseek-flash',
              'verifier_model': 'deepseek-v4-pro',
          }
          assert summary['raw_count'] == 20
          assert summary['provider_errors'] == 0
          assert 'VERIFIER_NOT_INDEPENDENT' not in summary['reject_reason_counts']
          Path('/tmp/task15-20-summary.json').write_text(
              json.dumps(summary, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('TASK15_20_SUMMARY=' + json.dumps(summary, sort_keys=True))
          print('TASK15_20_PRODUCTION=PASS')
          PY

      - name: Artifact safety
        shell: bash
        run: |
          ! grep -Eq 'raw_question|raw_answer|raw_analysis|raw_payload' /tmp/task15-20-summary.json
          echo TASK15_20_ARTIFACT_SAFETY=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: task15-deepseek-20-evidence
          path: |
            /tmp/task15-20-sample-meta.json
            /tmp/task15-20-summary.json
          if-no-files-found: error
          retention-days: 30
